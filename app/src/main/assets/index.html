function cleanSession(s){
  if(!s || !isDate(s.date)) return null;
  return {date:s.date, sport:normSport(s.sport), extra: s.extra===true || undefined, title:String(s.title||'Training').slice(0,120), goal:s.goal?String(s.goal).slice(0,600):'',
    distanceKm: Number(s.distanceKm)>0 ? Math.round(Number(s.distanceKm)*10)/10 : null,
    durationMin: Number(s.durationMin)>0 ? Math.round(Number(s.durationMin)) : null,
    steps: Array.isArray(s.steps) ? s.steps.slice(0,15).map(x=>({label:String(x&&x.label||'').slice(0,80), detail:String(x&&x.detail||'').slice(0,300)})) : []};
}

async function applyUpdates(u){
  if(!u || typeof u!=='object') return;
  const t = today();
  let pc=false, plc=false, lc=false;
  const pr = S.profile || (S.profile = JSON.parse(JSON.stringify(profile())));
  if(typeof u.name==='string' && u.name.trim()){ pr.name = u.name.trim().slice(0,40); pc=true; }
  if(Array.isArray(u.complaints)){ pr.complaints = u.complaints.map(c=>String(c||'').trim().slice(0,60)).filter(Boolean).slice(0,5); pc=true; }
  if(typeof u.performance==='string'){ pr.performance = u.performance.slice(0,400); pc=true; }
  if(Array.isArray(u.insights)){ pr.insights = u.insights.map(x=>String(x||'').trim().slice(0,200)).filter(Boolean).slice(0,25); pc=true; }
  if(u.goal && u.goal.text){ pr.goal = {text:String(u.goal.text).slice(0,200), date:isDate(u.goal.date)?u.goal.date:null}; pc=true; }
  if(Array.isArray(u.trainingDays)){ pr.trainingDays = [...new Set(u.trainingDays.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6))].sort(); pc=true; }
  if(Array.isArray(u.sports)){ pr.sports = [...new Set(u.sports.map(normSport))]; pc=true; }
  if(typeof u.background==='string' && u.background.trim()){ pr.background = u.background.slice(0,2000); pc=true; }
  if(u.plan && Array.isArray(u.plan.sessions)){
    // Einheiten an Nicht-Trainingstagen nur, wenn ausdrücklich als Zusatz markiert
    const td = new Set(pr.trainingDays||[]);
    const allow = new Set(((S.plan&&S.plan.allowDates)||[]).filter(d=>d>=t));
    const blocked = new Set(((S.plan&&S.plan.blockedDates)||[]).filter(d=>d>=t));
    const ok = s => { if(blocked.has(s.date) && !s.extra) return false; return !td.size || td.has(parseYmd(s.date).getDay()) || s.extra || allow.has(s.date); };
    const fresh = u.plan.sessions.map(cleanSession).filter(s=>s && s.date>=t && ok(s));
    const past = sessions().filter(s=>s.date<t && s.date>=addDays(t,-60));
    const keptCx = sessions().filter(s=>s.date>=t && s.cancelled);
    S.plan = {sessions: past.concat(keptCx, fresh.filter(f=>!keptCx.some(c=>c.date===f.date && c.title===f.title))).sort((a,b)=>a.date.localeCompare(b.date)), rationale:String(u.plan.rationale||(S.plan&&S.plan.rationale)||'').slice(0,4000), updatedAt:new Date().toISOString(), revision:((S.plan&&S.plan.revision)||0)+1,
      allowDates:[...allow].sort(), blockedDates:[...blocked].sort(), missedHandled:(S.plan&&S.plan.missedHandled)||[]};
    plc=true;
  }
  const log = S.log || (S.log={activities:[], feedback:{}, assessments:{}});
  log.feedback = log.feedback||{}; log.assessments = log.assessments||{};
  const ids = new Set(acts().map(a=>a.id));
  if(Array.isArray(u.feedback)) u.feedback.forEach(f => {
    if(!f || !ids.has(String(f.activityId))) return;
    const cur = Object.assign({}, log.feedback[f.activityId]);
    ['painDuring','painAfter','rpe'].forEach(k => { const n=Number(f[k]); if(f[k]!=null && Number.isFinite(n)) cur[k]=Math.max(0,Math.min(10,Math.round(n))); });
    if(f.note) cur.note = String(f.note).slice(0,200);
    log.feedback[f.activityId] = cur; lc=true;
  });
  if(Array.isArray(u.assessments)) u.assessments.forEach(a => {
    if(!a || !a.text || !ids.has(String(a.activityId))) return;
    log.assessments[a.activityId] = {text:String(a.text).slice(0,1500), short:a.short?String(a.short).slice(0,200):'', ts:new Date().toISOString()}; lc=true;
  });
  if(Array.isArray(u.weekSummaries)) u.weekSummaries.forEach(w => {
    if(!w || !isDate(w.week) || !w.text) return;
    log.weekSummaries = log.weekSummaries||{};
    log.weekSummaries[mondayOf(w.week)] = {text:String(w.text).slice(0,1200), ts:new Date().toISOString()}; lc=true;
  });
  if(plc && pr.pendingChanges && Object.keys(pr.pendingChanges).length){ pr.pendingChanges = {}; pc=true; }
  if(pc) await save('profile'); if(plc) await save('plan'); if(lc) await save('log');
}

function errText(e){
  const c = e && e.code;
  if(c==='not_configured') return 'Noch kein Claude-API-Schlüssel. Trag ihn in den Einstellungen unter „Verbindungen“ ein.';
  if(c==='bad_key') return 'Der Claude-API-Schlüssel ist ungültig. Bitte in den Einstellungen prüfen.';
  if(c==='no_credit') return 'Dein Anthropic-Konto hat kein Guthaben. Lade es in der Anthropic Console auf.';
  if(c==='not_granted'){ sampleState='denied'; return 'Zugriff auf Claude nicht erlaubt.'; }
  if(c==='sampling_disabled' || c==='not_declared' || c==='capability_disabled' || c==='capability_removed'){ sampleState='none'; return 'Claude ist in dieser Ansicht nicht verfügbar.'; }
  if(c==='rate_limited') return 'Gerade zu viele Anfragen oder Nutzungslimit erreicht. Bitte später erneut senden.';
  if(c==='session_expired') return 'Deine Anmeldung ist abgelaufen. Melde dich in claude.ai neu an.';
  if(c==='invalid_json') return 'Die Antwort war nicht lesbar. Bitte die Nachricht erneut senden.';
  if(c==='prompt_too_large') return 'Zu viele Daten für eine Anfrage. Lösche ältere Dialognachrichten in den Einstellungen.';
  if(c==='refused') return 'Claude hat diese Anfrage abgelehnt. Formuliere sie bitte anders.';
  return 'Verbindung unterbrochen. Bitte erneut senden.';
}

async function askClaude(text, opt={}){
  if(!sample || busy || !text.trim()) return;
  // Immer in den aktuellen S.chat schreiben: Snapshots ersetzen das Objekt während der Anfrage
  const push = m => { if(!S.chat) S.chat={messages:[]}; S.chat.messages = (S.chat.messages||[]).concat([m]).slice(-80); };
  push({role:'user', text:text.trim(), ts:Date.now(), auto:!!opt.auto});
  busy=true; render(); save('chat');
  const turns = [{role:'user', content:buildContext()}];
  S.chat.messages.filter(m=>!m.error && (m.ts||0)>=dialogSince).slice(-16).forEach(m => turns.push({role:m.role, content:m.text}));
  ctl = new AbortController();
  try{
    const res = await sample.json(turns, {cache:false, signal:ctl.signal, onText:()=>{ const el=document.getElementById('thinkTxt'); if(el) el.textContent='Claude schreibt …'; }});
    await applyUpdates(res && res.updates);
    const reply = res && typeof res.reply==='string' && res.reply.trim() ? res.reply.trim() : 'Erledigt.';
    push({role:'assistant', text:reply, ts:Date.now()});
  }catch(e){
    if(e && e.code==='cancelled') push({role:'assistant', text:'Abgebrochen.', ts:Date.now(), error:true});
    else push({role:'assistant', text:errText(e), ts:Date.now(), error:true});
  }finally{
    busy=false; ctl=null; await save('chat'); render();
  }
}
function send(){ const ta=document.getElementById('msgInput'); const v=(ta?ta.value:draft).trim(); if(!v) return; draft=''; askClaude(v); }

/* ---------- Ausgelassene Einheiten: einmalig melden und Umplanung anstoßen ---------- */
function missedSessions(){
  const t = today(), since = addDays(t,-3);
  const handled = new Set((S.plan && S.plan.missedHandled) || []);
  return active().filter(s => s.date<t && s.date>=since && normSport(s.sport)!=='rest' && !handled.has(s.date+'|'+(s.title||''))
    && !acts().some(a => a.date===s.date && a.sport===normSport(s.sport)));
}
let missedBusy = false;
async function checkMissed(){
  if(missedBusy || busy || !S.loaded || !S.plan || !sample || sampleState==='denied') return;
  const miss = missedSessions(); if(!miss.length) return;
  missedBusy = true;
  try{
    const keys = miss.map(s => s.date+'|'+(s.title||''));
    const desc = miss.map(s => {
      const other = acts().filter(a => a.date===s.date && a.sport!=='walk');
      return `${fmtDay(s.date)} „${s.title}“ (${SPORT[normSport(s.sport)]}${s.distanceKm?', '+fmtNum(s.distanceKm,1)+' km':''})`
        + (other.length ? ` – stattdessen: ${other.map(a=>SPORT[a.sport]+' '+fmtNum(a.distKm,1)+' km, '+Math.round(a.movingS/60)+' min').join('; ')}` : ' – nichts absolviert');
    }).join('; ');
    // synchron markieren und fragen, damit kein anderer Aufruf dazwischenkommt
    S.plan.missedHandled = [...new Set([...(S.plan.missedHandled||[]), ...keys])].slice(-60);
    const q = askClaude(`Ausgelassen laut Strava: ${desc}. Bitte plane die nächsten 14 Tage neu: Entscheide, ob die Inhalte nachgeholt, gekürzt oder gestrichen werden, und rechne Ersatztraining an. Frag kurz nach dem Grund, falls er für die Planung wichtig ist.`, {auto:true});
    await save('plan');
    await q;
  } finally { missedBusy = false; }
}
window.addEventListener('appresume', () => { render(); setTimeout(checkMissed, 300); });
document.addEventListener('visibilitychange', () => { if(!document.hidden){ render(); setTimeout(checkMissed, 300); } });

/* ---------- Ereignisse ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){
    const leavingSettings = tab==='einstellungen' && b.dataset.tab!=='einstellungen';
    if(b.dataset.tab!==tab && !busy){ dialogSince=Date.now(); draft=''; showAll=false; }
    tab=b.dataset.tab;
    if(leavingSettings && pendingList().length && sample && !busy){ try{localStorage.setItem('tb-tab',tab)}catch(_){} render(); window.scrollTo({top:0}); replanFromChanges(); return; } try{localStorage.setItem('tb-tab',tab)}catch(_){} render(); window.scrollTo({top:0}); return; }
  const a = b.dataset.action; if(!a) return;
  if(a==='sync') syncStrava();
  else if(a==='send') send();
  else if(a==='stop'){ if(ctl) ctl.abort(); }
  else if(a==='more'){ showAll=true; renderDialog(); }
  else if(a==='prefill'){ draft=b.dataset.text||''; renderDialog(); const ta=document.getElementById('msgInput'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); ta.scrollIntoView({block:'center',behavior:'smooth'}); } }
  else if(a==='assess'){ const x=acts().find(y=>y.id===b.dataset.id); if(x) askClaude(`Bitte schätze die Einheit „${x.name}“ vom ${fmtDay(x.date)} (ID ${x.id}) ein.`); }
  else if(a==='week-prev'){ weekOffset++; render(); }
  else if(a==='add-complaint' || a==='rm-yes'){
    const pr = S.profile || (S.profile = JSON.parse(JSON.stringify(profile())));
    const list = (pr.complaints||[]).slice();
    if(a==='add-complaint'){ const inp=document.getElementById('newComplaint'); const v=(inp&&inp.value||'').trim().slice(0,60); if(!v || list.length>=5) return; list.push(v); }
    else { list.splice(confirmRm,1); confirmRm=null; }
    pr.complaints = list; markChange('complaints', 'Beschwerden: '+(list.join(', ')||'keine')); render(); save('profile');
  }
  else if(a==='replan-changes') replanFromChanges();
  else if(a==='bg-open'){ bgDlg={edit:false}; renderMoveDialog(); }
  else if(a==='bg-close'){ bgDlg=null; renderMoveDialog(); }
  else if(a==='bg-edit'){ bgDlg.edit=true; renderMoveDialog(); }
  else if(a==='bg-edit-no'){ bgDlg.edit=false; renderMoveDialog(); }
  else if(a==='bg-save'){ const ta=document.getElementById('bgText'); const pr = S.profile || (S.profile = JSON.parse(JSON.stringify(profile()))); pr.background=(ta?ta.value:'').trim().slice(0,2000); save('profile'); bgDlg.edit=false; renderMoveDialog(); }
  else if(a==='hist-open'){ histDlg={confirm:false}; renderMoveDialog(); }
  else if(a==='hist-close'){ histDlg=null; renderMoveDialog(); render(); }
  else if(a==='hist-del'){ histDlg.confirm=true; renderMoveDialog(); }
  else if(a==='hist-del-no'){ histDlg.confirm=false; renderMoveDialog(); }
  else if(a==='hist-del-yes'){ S.chat={messages:[]}; showAll=false; save('chat'); histDlg.confirm=false; renderMoveDialog(); render(); }
  else if(a==='ins-open'){ insightDlg={edit:null}; renderMoveDialog(); }
  else if(a==='ins-close'){ insightDlg=null; renderMoveDialog(); render(); }
  else if(a==='ins-add'){ const i=document.getElementById('insNew'); const v=(i&&i.value||'').trim(); if(!v) return; setInsights([...insights(), v]); renderMoveDialog(); const n=document.getElementById('insNew'); if(n) n.focus(); }
  else if(a==='ins-del'){ const l=insights(); l.splice(Number(b.dataset.i),1); setInsights(l); renderMoveDialog(); }
  else if(a==='ins-edit'){ insightDlg.edit=Number(b.dataset.i); renderMoveDialog(); }
  else if(a==='ins-edit-no'){ insightDlg.edit=null; renderMoveDialog(); }
  else if(a==='ins-edit-yes'){ const ta=document.getElementById('insEdit'); const l=insights(); const i=Number(b.dataset.i); if(ta){ if(ta.value.trim()) l[i]=ta.value.trim(); else l.splice(i,1); } insightDlg.edit=null; setInsights(l); renderMoveDialog(); }
  else if(a==='ins-derive'){ insightDlg=null; renderMoveDialog(); askClaude('Bitte leite aus meinen bisherigen Aktivitäten, Rückmeldungen, Wochenfazits und dem Hintergrund die wichtigsten dauerhaften Erkenntnisse ab und liefere die vollständige Liste unter "insights". Behalte bestehende Erkenntnisse, sofern sie noch stimmen.'); }
  else if(a==='swap-open'){ swapDlg={date:b.dataset.date, title:b.dataset.title, text:''}; renderMoveDialog(); const ta=document.getElementById('swapText'); if(ta) ta.focus(); }
  else if(a==='swap-close'){ swapDlg=null; renderMoveDialog(); }
  else if(a==='swap-preset'){ if(swapDlg){ const p=b.dataset.p; swapDlg.text = (swapDlg.text||'').trim() ? swapDlg.text.trim()+', '+p : p; renderMoveDialog(); } }
  else if(a==='swap-do'){
    if(!swapDlg || !(swapDlg.text||'').trim()) return;
    const {date, title} = swapDlg, wish = swapDlg.text.trim();
    swapDlg=null; renderMoveDialog();
    if(S.plan){ S.plan.allowDates = [...new Set([...(S.plan.allowDates||[]), date])].filter(d=>d>=today()).sort(); await save('plan'); }
    if(sample && !busy) askClaude(`Bitte plane „${title}“ am ${fmtDay(date)} um. Stattdessen möchte ich: ${wish}. Ersetze die Einheit am selben Tag (Titel, Ziel der Einheit, konkrete Schritte) und gleiche die übrigen Einheiten der nächsten 14 Tage bei Bedarf an, damit Belastung und Wochenumfang stimmig bleiben. Weise kurz darauf hin, falls der Wunsch für das Ziel oder die Beschwerden ungünstig ist.`);
  }
  else if(a==='cancel-open'){ cancelDlg={date:b.dataset.date, title:b.dataset.title, preset:null, reason:''}; renderMoveDialog(); }
  else if(a==='cancel-close'){ cancelDlg=null; renderMoveDialog(); }
  else if(a==='cancel-preset'){ if(cancelDlg){ cancelDlg.preset = cancelDlg.preset===b.dataset.p ? null : b.dataset.p; renderMoveDialog(); } }
  else if(a==='cancel-do'){
    if(!cancelDlg || !S.plan) return;
    const {date, title} = cancelDlg; const reason = [cancelDlg.preset, (cancelDlg.reason||'').trim()].filter(Boolean).join(': ');
    cancelDlg=null; renderMoveDialog();
    const s = S.plan.sessions.find(x=>x.date===date && (x.title||'')===title && !x.cancelled); if(!s) return;
    s.cancelled = {reason, ts:new Date().toISOString()};
    S.plan.blockedDates = [...new Set([...(S.plan.blockedDates||[]), date])].filter(d=>d>=today()).sort();
    render(); await save('plan');
    if(sample && !busy) askClaude(`Ich habe „${title}“ am ${fmtDay(date)} abgesagt. Grund: ${reason||'keine Angabe'}. Bitte berücksichtige den Grund bei der Umplanung der nächsten 14 Tage: Bei Krankheit oder Beschwerden die Belastung danach reduzieren und vorsichtig wieder einsteigen, bei Zeitmangel oder Wetter wichtige Inhalte sinnvoll auf andere Trainingstage verteilen, ohne Ruhetage zu opfern. Am ${fmtDay(date)} nichts planen. Frag nach, wenn der Grund für die Planung unklar ist.`, {auto:true});
  }
  else if(a==='move-open'){ moveDlg={from:b.dataset.date, title:b.dataset.title, to:null}; renderMoveDialog(); }
  else if(a==='move-close'){ moveDlg=null; renderMoveDialog(); }
  else if(a==='move-pick'){ if(moveDlg){ moveDlg.to=b.dataset.to; renderMoveDialog(); } }
  else if(a==='move'){
    if(!moveDlg) return;
    const to = moveDlg.to, from = moveDlg.from, title = moveDlg.title;
    moveDlg=null; renderMoveDialog();
    if(!S.plan || !isDate(to) || to===from) return;
    const s = S.plan.sessions.find(x=>x.date===from && (x.title||'')===title); if(!s) return;
    s.date = to; s.extra = true;
    const uniq = arr => [...new Set(arr)].filter(d=>d>=today()).sort();
    S.plan.allowDates = uniq([...(S.plan.allowDates||[]), to]);
    S.plan.blockedDates = uniq([...(S.plan.blockedDates||[]).filter(d=>d!==to), from]);
    S.plan.sessions.sort((x,y)=>x.date.localeCompare(y.date));
    render(); await save('plan');
    if(sample && !busy) askClaude(`Ich habe „${s.title}“ von ${fmtDay(from)} auf ${fmtDay(to)} verschoben, weil ich am ${fmtDay(from)} nicht kann. Die Einheit bleibt am ${fmtDay(to)}, am ${fmtDay(from)} bitte nichts planen. Prüfe Abstände und Belastung der angrenzenden Einheiten und passe den Plan an: Einheiten bei Bedarf kürzen oder tauschen und dafür andere verlängern, damit der Wochenumfang passt.`, {auto:true});
  }
  else if(a==='rm-complaint'){ confirmRm=Number(b.dataset.i); render(); }
  else if(a==='rm-no'){ confirmRm=null; render(); }
  else if(a==='info'){ infoOpen=!infoOpen; render(); }
  else if(a==='week-last'){ weekOffset=lastWeekOffset(); render(); }
  else if(a==='week-next'){ weekOffset=Math.max(0,weekOffset-1); render(); }
  else if(a==='week-summary'){
    const mon=b.dataset.mon, sun=addDays(mon,6);
    const dlg=((S.chat&&S.chat.messages)||[]).filter(m=>!m.error && m.ts && ymd(new Date(m.ts))>=mon && ymd(new Date(m.ts))<=sun)
      .map(m=>(m.role==='user'?userName()+': ':'Claude: ')+m.text.slice(0,400)).join('\n').slice(-6000);
    askClaude(`Bitte erstelle das Wochenfazit für die Woche ab ${fmtDay(mon)} (Schlüssel ${mon}): Training in Stichworten, ${careMode()?'Beschwerdesignale':'Befinden'}, Belastung, Auswertung und was im Dialog besprochen wurde. Gib zu jeder Einheit dieser Woche ohne Einschätzung eine kurze Einschätzung mit "short" an.${dlg?'\n\nDialog dieser Woche:\n'+dlg:''}`);
  }
  else if(a==='replan') askClaude('Bitte plane die nächsten 14 Tage auf Basis meiner letzten Einheiten und Rückmeldungen neu.');
  else if(a==='day' || a==='sport'){
    const pr = S.profile || (S.profile = JSON.parse(JSON.stringify(profile())));
    if(a==='day'){ const d=Number(b.dataset.day); const s=new Set(pr.trainingDays||[]); s.has(d)?s.delete(d):s.add(d); pr.trainingDays=[...s].sort();
      markChange('days', 'Trainingstage: '+([1,2,3,4,5,6,0].filter(x=>s.has(x)).map(x=>WD[x]).join(', ')||'keine')); }
    else { const k=b.dataset.sport; const s=new Set(pr.sports||[]); s.has(k)?s.delete(k):s.add(k); pr.sports=[...s];
      markChange('sports', 'Sportarten: '+(pr.sports.map(x=>SPORT[x]).join(', ')||'keine')); }
    render(); save('profile');
  }
  else if(a==='cf-claude'){ const k=document.getElementById('cfKey'), m=document.getElementById('cfModel'); window.Android.setClaude(k?k.value:'', m?m.value:''); render(); }
  else if(a==='cf-strava'){ const i=document.getElementById('cfSid'), sc=document.getElementById('cfSecret'); window.Android.setStravaClient(i?i.value:'', sc?sc.value:''); window.Android.stravaConnect(); }
  else if(a==='cf-strava-off'){ window.Android.stravaDisconnect(); render(); }
  else if(a==='cf-export'){ if(!window.Android.saveBackup('lauf-doch-sicherung-'+today()+'.json', JSON.stringify(window.__ldExport()))) window.Android.toast('Sicherung konnte nicht gespeichert werden.'); }
  else if(a==='cf-import'){ window.Android.pickBackup(); }
  else if(a==='cf-import-no'){ confirmImport=null; render(); }
  else if(a==='cf-import-yes'){ const o=confirmImport; confirmImport=null; window.__ldImport(o); window.Android.toast('Sicherung übernommen.'); weekInit=false; render(); }
  else if(a==='clear'){ confirmClear=true; render(); }
  else if(a==='clear-no'){ confirmClear=false; render(); }
  else if(a==='clear-yes'){ confirmClear=false; S.chat={messages:[]}; showAll=false; render(); save('chat'); }
});

/* ---------- Start ---------- */
render();
(async () => {
  const cl = window.claude;
  if(!cl || !cl.use){ mcpState='none'; sampleState='none'; S.loaded=true; render(); return; }
  cl.use('mcp').then(m => { mcp=m; mcpState=m?'ok':'none'; render(); });
  cl.use('sample').then(s => { sample=s; sampleState=s?'ok':'none'; render(); setTimeout(checkMissed, 500); });
  const [user, dbx] = await Promise.all([cl.use('user'), cl.use('db')]);
  db = dbx; uid = user ? await user.id() : null;
  if(!db || !uid){ S.loaded=true; syncMsg={err:true, text:'Speichern ist in dieser Ansicht nicht möglich. Öffne die App angemeldet in claude.ai.'}; render(); return; }
  let pending = 4;
  ['profile','plan','log','chat'].forEach(name => {
    db.doc('data/users/'+uid+'/'+name).onSnapshot(snap => {
      S[name] = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
      if(pending>0){ pending--; if(pending===0){ S.loaded=true; setTimeout(checkMissed, 500); } }
      if(!(busy && name==='chat')) render();
    }, () => { if(pending>0){ pending--; if(pending===0) S.loaded=true; } render(); });
  });
})();
})();
</script>
