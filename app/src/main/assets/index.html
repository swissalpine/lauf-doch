<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lauf doch!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
html{height:100%}
/* Layout: schmale App-Spalte in Telefonbreite, Kopf mit Name, Tab-Inhalt, Dialog mit Claude, Navigationsleiste unten. Farbe: kräftiges Kobaltblau */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#E9EDF5; --ink:#121826; --muted:#586379; --line:#D6DCE8;
  --accent:#2350F5; --accent-ink:#FFFFFF; --accent-soft:#E2E9FF;
  --ok:#2B7A4B; --ok-soft:#DFF0E5; --warn:#9A6312; --warn-soft:#F6EAD3; --crit:#B3261E; --crit-soft:#F7DEDB;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1019; --surface:#151B28; --sunk:#10151F; --ink:#E6EBF5; --muted:#919CB3; --line:#262F43;
  --accent:#7D9BFF; --accent-ink:#0A0F1C; --accent-soft:#1C2648;
  --ok:#72C690; --ok-soft:#18301F; --warn:#E2B158; --warn-soft:#33281A; --crit:#F08C82; --crit-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1019; --surface:#151B28; --sunk:#10151F; --ink:#E6EBF5; --muted:#919CB3; --line:#262F43;
  --accent:#7D9BFF; --accent-ink:#0A0F1C; --accent-soft:#1C2648;
  --ok:#72C690; --ok-soft:#18301F; --warn:#E2B158; --warn-soft:#33281A; --crit:#F08C82; --crit-soft:#3A1E1B; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0}
.brand .date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;margin-top:8px}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:10px 2px 12px;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
.panel{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.plan{background:var(--accent-soft);color:var(--accent)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.extra{background:var(--warn-soft);color:var(--warn)}
.sport{font-size:13px;color:var(--muted);margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.big{width:100%;padding:14px 16px;font-size:16px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.sync{display:flex;flex-direction:column;gap:6px}
.sync small{color:var(--muted);font-size:13px}
.status{font-size:13px;padding:8px 12px;border-radius:8px}
.status.err{background:var(--crit-soft);color:var(--crit)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.metric{display:flex;flex-direction:column}
.metric .v{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.metric .k{font-size:12px;color:var(--muted)}
.target{font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.purpose{background:var(--sunk);border-radius:8px;padding:10px 12px}
.purpose b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px 8px;padding:8px 0;border-top:1px solid var(--line)}
ol.steps li::before{content:counter(s);grid-row:span 2;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
ol.steps .l{font-weight:600}
ol.steps .d{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--sunk);font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.assess{border-left:3px solid var(--accent);padding:2px 0 2px 12px;white-space:pre-wrap}
.assess b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.planref{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.rest{display:flex;flex-direction:column;gap:4px}
.goal{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.goal .eyebrow{color:var(--accent-ink);opacity:.8}
.goal .gtext{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.15;text-wrap:balance}
.goal .gdate{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.days{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day.today{background:var(--accent-soft)}
.day .dl{font-variant-numeric:tabular-nums;line-height:1.2}
.day .dl b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600}
.day .dl span{font-size:13px;color:var(--muted)}
.day .items{display:flex;flex-direction:column;gap:6px;min-width:0}
.day details summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.day details summary::-webkit-details-marker{display:none}
.day details summary .t{font-weight:600}
.day details summary .x{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.day details[open] summary{margin-bottom:6px}
.day .restline{color:var(--muted);font-size:14px}
.donemark{font-size:13px;color:var(--ok);font-weight:500}
.rationale{white-space:pre-wrap}
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:600;cursor:pointer;text-align:center}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sports{display:flex;flex-wrap:wrap;gap:8px}
.sports .toggle{padding:8px 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* Dialog */
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.dialog-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.msgs{display:flex;flex-direction:column;gap:10px;padding:14px 16px;max-height:420px;overflow-y:auto}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg.error{background:var(--crit-soft);color:var(--crit)}
.msg.auto{align-self:center;background:none;color:var(--muted);font-size:13px;text-align:center;max-width:100%;padding:2px 0}
.thinking{align-self:flex-start;color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center}
.compose{display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.compose textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.compose .row{flex-wrap:nowrap}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{font-size:13px;border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.suggest button:hover{color:var(--accent);border-color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted)}
/* Rückblick */
.weeknav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}
.weeknav button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.weeknav button[disabled]{opacity:.35;cursor:default}
.weeknav .wl{text-align:center;line-height:1.2}
.weeknav .wl b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600}
.weeknav .wl span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.log{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.entry{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .dl{font-variant-numeric:tabular-nums;line-height:1.2}
.entry .dl b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600}
.entry .dl span{font-size:13px;color:var(--muted)}
.entry .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.entry .facts{font-variant-numeric:tabular-nums;font-weight:600}
.entry .facts .s{font-weight:400;color:var(--muted)}
.entry .short{font-size:14px}
.entry.missed .facts{color:var(--muted);font-weight:400}
.summary{white-space:pre-wrap}
.perf{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.perf b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lc{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end}
.lcol{display:flex;flex-direction:column;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.lcol .lv{font-size:11px;color:var(--muted);line-height:1}
.lcol .lb{width:100%;max-width:26px;background:var(--line);border-radius:3px 3px 0 0;min-height:2px}
.lcol .lk{font-size:11px;color:var(--muted);line-height:1.2}
.lcol.sel .lb{background:var(--accent)}
.lcol.sel .lv,.lcol.sel .lk{color:var(--ink);font-weight:600}
.entry .pl{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ht{display:flex;align-items:center;gap:8px}
.banner{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--ink)}
.banner b{color:var(--warn)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld > span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea,.addrow input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);resize:vertical}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.chip.cmp{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);font-weight:500;padding:4px 6px 4px 11px}
.chip.cmp button{border:0;background:none;color:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0 4px}
.info{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);background:none;color:var(--muted);font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:13px;line-height:1;cursor:pointer;padding:0;flex:none}
.info[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gloss{margin:0;display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:8px;padding:12px}
.gloss dt{font-weight:600;font-size:14px}
.gloss dd{margin:2px 0 0;font-size:13px;color:var(--muted)}
/* Handyformat: App-Spalte in Telefonbreite, auch auf großen Bildschirmen */
.app{max-width:430px}
body{font-size:14px}
h3{font-size:21px}
h2{font-size:19px}
.card{padding:14px;gap:10px}
.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric .v{font-size:21px}
.wsum{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wsum .metric .v{font-size:19px}
.wsum .metric .k{font-size:11.5px}
.goal{padding:12px 14px;gap:6px}
.goal .gtext{font-size:18px;line-height:1.25}
.goal .gdate{font-size:13px;gap:12px}
.brand h1{font-size:23px}
/* Navigationsleiste unten (wie in Android-Apps) */
header.bar{padding:12px 16px}
.app{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);margin:0;gap:0;z-index:6;
  background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{display:flex;justify-content:center;align-items:center;padding:6px 2px;border-bottom:0}
nav.tabs button span.pill{display:flex;justify-content:center;align-items:center;width:58px;height:34px;border-radius:17px}
nav.tabs button[aria-selected="true"] span.pill{background:var(--accent-soft)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.45);border:0;z-index:20;cursor:default}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);z-index:21;background:var(--surface);border-radius:18px 18px 0 0;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:90%;overflow-y:auto}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mday{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 0;cursor:pointer;font-variant-numeric:tabular-nums;min-width:0}
.mday b{font-size:13px}
.mday span{font-size:12px;color:var(--muted)}
.mday i{font-style:normal;font-size:9px;color:var(--muted);height:11px;overflow:hidden;max-width:100%;white-space:nowrap}
.mday.td{border-color:var(--accent-soft);background:var(--accent-soft)}
.mday.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mday.sel span,.mday.sel i{color:var(--accent-ink)}
.mday[disabled]{opacity:.4;cursor:default}
.row.end{justify-content:flex-end}
.pchip{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cancelled .ct{font-weight:600;text-decoration:line-through;color:var(--muted)}
.day .cx .t{text-decoration:line-through;color:var(--muted)}
.day .cx .x{font-size:13px;color:var(--warn)}
.sel{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg)}
/* Kompakte Höhen */
header.bar{padding:8px 16px}
.brand h1{font-size:21px}
main{gap:12px;padding-top:12px}
.panel{gap:10px}
.card{padding:12px;gap:8px}
h2{font-size:18px}
.muted,.note{font-size:13px;line-height:1.4}
.fld{gap:3px}
.fld input,.fld textarea,.addrow input{padding:7px 10px}
.toggle{padding:7px 0}
.sports .toggle{padding:6px 12px}
.sports{gap:6px}
.days .day,.entry{padding:9px 12px}
.dialog-head{padding:10px 14px 8px}
.msgs{padding:10px 14px;gap:8px}
.compose{padding:10px 14px 12px;gap:6px}
.compose textarea{min-height:48px;padding:8px 10px}
.btn{padding:7px 12px}
.btn.big{padding:11px 14px}
nav.tabs{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs button{padding:4px 2px}
.app{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
.restday{background:var(--sunk)}
.restday h3{color:var(--muted)}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ins li{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.ins li:first-child{border-top:0}
.ins li:has(.ia){flex-direction:row;align-items:flex-start;justify-content:space-between}
.ins li > span:first-child{min-width:0;overflow-wrap:anywhere}
.ins .ia{display:flex;gap:2px;flex:none}
.ins .ib{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;padding:2px 6px;cursor:pointer;border-radius:6px}
.ins .ib:hover{color:var(--accent);background:var(--accent-soft)}
.ins textarea{width:100%;border:1px solid var(--accent);border-radius:8px;padding:7px 9px;background:var(--surface);resize:vertical}
.sheet.tall{max-height:88%}
.hist{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow-y:auto;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hist .msg{max-width:92%;font-size:14px}
.hist .msg.assistant{background:var(--surface)}
.hist .msg.autouser{opacity:.85}
.hday{align-self:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:2px 10px;border-radius:999px;background:var(--sunk)}
.htime{display:block;font-size:11.5px;opacity:.7;margin-top:3px;text-align:right}
.hauto{display:block;font-size:11.5px;font-weight:600;opacity:.8;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.bgview{white-space:pre-wrap;max-height:50vh;overflow-y:auto;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.bgta{width:100%;border:1px solid var(--accent);border-radius:10px;padding:9px 11px;background:var(--surface);resize:vertical}
.md{white-space:normal}
.md p{margin:0 0 .55em}
.md p:last-child,.md ul:last-child,.md ol:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 .55em;padding-left:1.25em}
.md li{margin:.15em 0}
.md .mdh{font-weight:700}
.md code{font-family:ui-monospace,monospace;font-size:.92em;background:var(--sunk);padding:0 .3em;border-radius:4px}
.msg:has(.md){white-space:normal}
.rationale.md,.summary.md{white-space:normal}
.move{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:8px}
.move label{font-size:13px;color:var(--muted)}
.move select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);min-width:0;flex:1}
.weekdays{gap:4px}
.toggle{font-size:14px;padding:9px 0}
.msgs{max-height:340px}
.msg{max-width:92%}
.day,.entry{grid-template-columns:52px minmax(0,1fr);gap:10px;padding:11px 12px}
.weeknav .wl b{font-size:21px}
.btn.big{padding:13px 14px;font-size:15px}
@media (min-width:600px){.app{border-inline:1px solid var(--line);min-height:100%}nav.tabs{border-inline:1px solid var(--line)}}
.badge{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
@media (max-width:420px){.wsum{grid-template-columns:repeat(2,minmax(0,1fr))}nav.tabs button{font-size:15px}}
@media (max-width:420px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.weekdays{gap:4px}.toggle{font-size:14px}}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.2s infinite ease-in-out}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
/* Kleine Schriften etwas größer (große Schriften unverändert) */
body{font-size:15px}
.muted,.note{font-size:14px}
.eyebrow,.tag,.fld > span,.purpose b,.assess b,.perf b{font-size:13px}
.metric .k{font-size:13px}
.wsum .metric .k{font-size:12.5px}
.chip,.pchip,.suggest button,.sync small,.status,.sport,.entry .pl,.day .cx .x,.donemark{font-size:14px}
ol.steps .d,.day details summary .x,.day .restline,.gloss dd,.entry .short,.planref{font-size:15px}
.gloss dt{font-size:15px}
.day .dl span,.entry .dl span,.weeknav .wl span,.brand .date{font-size:14px}
.lcol .lv,.lcol .lk{font-size:12px}
.mday b{font-size:14px}
.mday span{font-size:13px}
.mday i{font-size:10px;height:12px}
.msg.auto{font-size:14px}
/* Dialog mit Claude hervorheben */
.dialog{background:var(--accent-soft);border:1.5px solid var(--accent)}
.dialog-head{background:var(--accent);border-bottom:0}
.dialog-head h2,.dialog-head .note{color:var(--accent-ink)}
.dialog-head .note{opacity:.85}
.dialog .compose{border-top-color:var(--accent-soft)}
.dialog .compose textarea{background:var(--surface);border-color:var(--accent)}
.dialog .msg.assistant{background:var(--surface)}
.dialog .suggest button{background:var(--surface);border-style:solid;border-color:var(--accent);color:var(--accent)}
</style>

<body>

<div class="app">
  <header class="bar">
    <div class="brand"><h1>Lauf doch!</h1><span class="date" id="hdrDate"></span></div>
  </header>
  <main>
    <section class="panel" id="panel"></section>
    <section class="dialog" id="dialog" aria-label="Dialog mit Claude"></section>
  </main>
  <div id="modal"></div>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      <button role="tab" id="tab-heute" data-tab="heute" aria-selected="true" aria-label="Heute" title="Heute"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></span></button>

      <button role="tab" id="tab-rueckblick" data-tab="rueckblick" aria-selected="false" aria-label="Rückblick" title="Rückblick"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4.5v4h4"/><path d="M12 8v4.5l3 2"/></svg></span></button>
      <button role="tab" id="tab-einstellungen" aria-label="Einstellungen" title="Einstellungen" data-tab="einstellungen" aria-selected="false"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span></button>
    </nav>
</div>

<script src="shim.js"></script>
<script>
(() => {
'use strict';
const IN_APP = !!window.IN_APP;
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WD_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const SPORT = {run:'Laufen', ride:'Rad', strength:'Kraft', walk:'Gehen', other:'Sonstiges', rest:'Ruhe'};
const SERVER = 'Strava';

const S = {profile:null, plan:null, log:null, chat:null, loaded:false};
let db=null, uid=null, mcp=null, mcpState='loading', sample=null, sampleState='loading';
const TABS = {heute:'Heute', plan:'Plan', rueckblick:'Rückblick', einstellungen:'Einstellungen'};
let weekOffset = 0;
let dialogSince = Date.now(); // Dialog beginnt bei jedem Laden und Tab-Wechsel leer
let tab = 'heute', busy=false, ctl=null, syncBusy=false, syncMsg=null, confirmClear=false, showAll=false, draft='';

try{ const h=(location.hash||'').slice(1); if(TABS[h]) tab=h; else { const t=localStorage.getItem('tb-tab'); if(TABS[t]) tab=t; } }catch(e){}

/* ---------- Hilfsfunktionen ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Kleines, sicheres Markdown für Claudes Texte: erst escapen, dann Fett, Kursiv, Code, Überschriften und Listen */
function md(src){
  const inline = t => t
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/__([^_]+)__/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>');
  const lines = esc(src).replace(/\r/g,'').split('\n');
  let html = '', list = null, para = [];
  const flushPara = () => { if(para.length){ html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
  const flushList = () => { if(list){ html += `<${list.type}>` + list.items.map(x=>'<li>'+inline(x)+'</li>').join('') + `</${list.type}>`; list = null; } };
  lines.forEach(raw => {
    const l = raw.trim();
    let m;
    if(!l){ flushPara(); flushList(); return; }
    if((m = l.match(/^#{1,6}\s+(.*)$/))){ flushPara(); flushList(); html += '<p class="mdh">' + inline(m[1]) + '</p>'; return; }
    if((m = l.match(/^[-*•]\s+(.*)$/))){ flushPara(); if(!list || list.type!=='ul'){ flushList(); list = {type:'ul', items:[]}; } list.items.push(m[1]); return; }
    if((m = l.match(/^\d+[.)]\s+(.*)$/))){ flushPara(); if(!list || list.type!=='ol'){ flushList(); list = {type:'ol', items:[]}; } list.items.push(m[1]); return; }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)){ flushPara(); flushList(); return; }
    flushList(); para.push(l);
  });
  flushPara(); flushList();
  return html;
}
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (s,n) => { const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const fmtDay = s => { const d=parseYmd(s); return WD[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'; };
const fmtNum = (n,dig=1) => Number(n).toLocaleString('de-DE',{minimumFractionDigits:dig,maximumFractionDigits:dig});
const fmtDur = sec => { sec=Math.round(sec||0); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h? h+':'+pad(m)+':'+pad(s) : m+':'+pad(s); };
const fmtPace = (km,sec) => { if(!km) return '–'; let t=Math.round(sec/km); return Math.floor(t/60)+':'+pad(t%60); };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
function sportOf(t){ t=String(t||''); if(/Run/i.test(t)) return 'run'; if(/Ride|Cycl|Bike/i.test(t)) return 'ride'; if(/Weight|Strength|Workout|Crossfit|Yoga|Pilates/i.test(t)) return 'strength'; if(/Walk|Hike/i.test(t)) return 'walk'; return 'other'; }
function normSport(s){ s=String(s||'').toLowerCase(); return SPORT[s]? s : (/lauf|run/.test(s)?'run':/rad|rolle|ride|bike/.test(s)?'ride':/kraft|strength/.test(s)?'strength':/ruhe|rest|pause/.test(s)?'rest':'other'); }
const daysUntil = s => Math.round((parseYmd(s)-parseYmd(today()))/86400000);
const mondayOf = s => { const d=parseYmd(s); return addDays(s, -((d.getDay()+6)%7)); };
function isoWeek(s){ const d=parseYmd(s); const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()+3-((d.getDay()+6)%7)); const w1=new Date(t.getFullYear(),0,4); return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7); }
/* ---------- Leistungsanalyse (rein rechnerisch, später 1:1 nach Kotlin) ---------- */
const EFFECT = ['', 'Regeneration', 'Grundlagenausdauer', 'Aerob intensiv (Tempo)', 'Schwelle', 'VO2max / anaerob'];
function hrZone(hr){ const z=S.log&&S.log.zones&&S.log.zones.hrMins; if(!z||!hr) return null; let i=0; for(let k=0;k<z.length;k++) if(hr>=z[k]) i=k; return i+1; }
function analyze(a){
  const p = a && a.perf; if(!p) return null;
  const r = {};
  if(p.hr){
    r.hr = p.hr; r.zone = hrZone(p.hr); r.effect = EFFECT[r.zone] || null;
    if(a.sport==='run' && a.movingS && a.distKm) r.ef = (a.distKm*1000/(a.movingS/60))/p.hr;
    const laps = (p.laps||[]).filter(l=>l.hr && l.s);
    if(laps.length){
      const tz=[0,0,0,0,0]; let tot=0;
      laps.forEach(l=>{ const z=hrZone(l.hr); if(z){ tz[z-1]+=l.s; tot+=l.s; } });
      if(tot) r.tiz = tz.map(x=>Math.round(x/tot*100));
    }
    // Entkopplung Pace:HF (ohne ersten Kilometer wegen HF-Anstieg)
    if(a.sport==='run' && laps.length>=4){
      const L = laps.slice(1).filter(l=>l.d>0);
      const half = L.reduce((s,l)=>s+l.d,0)/2; let acc=0; const A=[],B=[];
      L.forEach(l=>{ (acc<half?A:B).push(l); acc+=l.d; });
      const ef = arr => { const d=arr.reduce((s,l)=>s+l.d,0), t=arr.reduce((s,l)=>s+l.s,0), h=arr.reduce((s,l)=>s+l.hr*l.s,0)/t; return (d/(t/60))/h; };
      if(A.length && B.length){ const e1=ef(A), e2=ef(B); r.decoupling = (e1-e2)/e1*100; }
    }
  }
  const ftp = S.log && S.log.zones && S.log.zones.ftp;
  if(a.sport==='ride' && p.watts && p.deviceWatts && ftp){ r.if = p.watts/ftp; r.tss = Math.round(a.movingS/3600*r.if*r.if*100); }
  return r;
}
function loadAt(d){
  const sum = (from,to) => acts().filter(a=>a.date>from && a.date<=to).reduce((s,a)=>s+(a.re||0),0);
  const acute = sum(addDays(d,-7),d), chronic = sum(addDays(d,-28),d)/4;
  return {acute, chronic, acwr: chronic ? acute/chronic : null};
}
function acwrInfo(x){
  if(x==null) return ['', 'zu wenig Daten'];
  if(x<0.8) return ['', 'Entlastung']; if(x<=1.3) return ['ok','im Rahmen']; if(x<=1.5) return ['warn','erhöht']; return ['crit','hoch'];
}
const decClass = d => d==null?'':(d<5?'ok':d<10?'warn':'crit');
function weekStats(mon){
  const sun = addDays(mon,6), end = sun<today()?sun:today();
  const wa = acts().filter(a=>a.date>=mon && a.date<=sun);
  const runs = wa.filter(a=>a.sport==='run');
  const efs = runs.map(analyze).filter(r=>r&&r.ef).map(r=>r.ef);
  return {re: wa.reduce((s,a)=>s+(a.re||0),0), acwr: loadAt(end).acwr, ef: efs.length? efs.reduce((s,x)=>s+x,0)/efs.length : null,
    km: runs.reduce((s,a)=>s+a.distKm,0)};
}
const painClass = p => p==null?'':(p<=2?'ok':p<=4?'warn':'crit');

const complaints = () => (profile().complaints||[]).filter(Boolean);
const careMode = () => complaints().length>0;
const userName = () => profile().name || 'der Nutzer';
const fbTemplate = d => careMode()
  ? `Rückmeldung zur Einheit vom ${fmtDay(d)}: Schmerz während _/10, danach _/10, Belastung _/10. `
  : `Rückmeldung zur Einheit vom ${fmtDay(d)}: Belastung _/10, Befinden: `;
const profile = () => S.profile || {goal:null, trainingDays:[], sports:['run','ride','strength'], background:''};
const acts = () => (S.log && Array.isArray(S.log.activities)) ? S.log.activities : [];
const fb = id => (S.log && S.log.feedback && S.log.feedback[id]) || null;
const assess = id => (S.log && S.log.assessments && S.log.assessments[id]) || null;
const active = () => sessions().filter(s=>!s.cancelled);
const sessions = () => (S.plan && Array.isArray(S.plan.sessions)) ? S.plan.sessions : [];

/* ---------- Speicher ---------- */
const queues = {};
function save(name){
  if(!db || !uid || !S[name]) return Promise.resolve();
  const data = JSON.parse(JSON.stringify(S[name]));
  queues[name] = (queues[name]||Promise.resolve()).then(() => db.doc('data/users/'+uid+'/'+name).set(data)).catch(e => {
    syncMsg = {err:true, text:'Speichern fehlgeschlagen ('+(e&&e.code||'Fehler')+'). Änderungen gelten nur bis zum Neuladen.'}; render();
  });
  return queues[name];
}

/* ---------- Rendering ---------- */
function render(){
  document.getElementById('hdrDate').textContent = WD_LONG[new Date().getDay()]+', '+new Date().toLocaleDateString('de-DE');
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab===tab)));
  const p = document.getElementById('panel');
  p.innerHTML = changeBanner() + (tab==='heute' ? renderToday() : tab==='plan' ? renderPlan() : tab==='rueckblick' ? renderHistory() : renderSettings());
  renderDialog();
  renderMoveDialog();
}

/* Einheit auf einen anderen Tag verschieben */
function moveControl(s){
  if(s.date < today() || s.cancelled || normSport(s.sport)==='rest') return '';
  const da = `data-date="${esc(s.date)}" data-title="${esc(s.title||'')}"`;
  return `<div class="move"><button class="btn" data-action="move-open" ${da}>Verschieben</button><button class="btn" data-action="swap-open" ${da}>Umplanen</button><button class="btn" data-action="cancel-open" ${da}>Absagen</button></div>`;
}
function cancelledCard(s){
  return `<div class="card cancelled"><div class="card-head"><span class="tag extra">Abgesagt</span><span class="sport">${esc(SPORT[normSport(s.sport)])} · ${esc(fmtDay(s.date))}</span></div>
    <p class="ct">${esc(s.title||'Training')}</p>${s.cancelled.reason?`<p class="muted">Grund: ${esc(s.cancelled.reason)}</p>`:''}</div>`;
}
/* Dialog zum Verschieben (Bottom Sheet) */
let moveDlg = null; // {from, title, to}
let cancelDlg = null; // {date, title, preset, reason}
let swapDlg = null; // {date, title, text}
let insightDlg = null; // {edit: index|null}
let bgDlg = null;   // {edit:bool}
let histDlg = null; // {confirm:bool}
function renderBgDialog(el){
  const bg = profile().background || '';
  el.innerHTML = `<button class="overlay" data-action="bg-close" aria-label="Schließen" tabindex="-1"></button>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bgTitle">
      <h2 id="bgTitle">Hintergrund für die Planung</h2>
      <p class="muted">Vorgeschichte, Rahmenbedingungen und Gewohnheiten. Claude bekommt den Text bei jeder Planung und passt ihn an, wenn du im Dialog etwas Grundlegendes änderst.</p>
      ${bgDlg.edit
        ? `<textarea id="bgText" class="bgta" rows="9" aria-label="Hintergrund bearbeiten">${esc(bg)}</textarea>
           <div class="row end"><button class="btn" data-action="bg-edit-no">Abbrechen</button><button class="btn primary" data-action="bg-save">Speichern</button></div>`
        : `<div class="bgview">${bg?esc(bg):'<span class="muted">Noch keine Angaben.</span>'}</div>
           <div class="row end"><button class="btn" data-action="bg-edit">Bearbeiten</button><button class="btn primary" data-action="bg-close">Fertig</button></div>`}
    </div>`;
  const ta = document.getElementById('bgText'); if(ta) ta.focus();
}
function renderHistDialog(el){
  const msgs = (S.chat && S.chat.messages) || [];
  let lastDay = '', body = '';
  msgs.forEach(m => {
    const d = m.ts ? ymd(new Date(m.ts)) : '';
    if(d && d!==lastDay){ lastDay=d; body += `<div class="hday">${esc(fmtDay(d))}</div>`; }
    const time = m.ts ? new Date(m.ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : '';
    body += `<div class="msg ${m.error?'assistant error':m.role}${m.auto?' autouser':''}">${m.auto?'<span class="hauto">automatisch</span>':''}${m.role==='assistant'&&!m.error?`<div class="md">${md(m.text)}</div>`:esc(m.text)}<span class="htime">${esc(time)}</span></div>`;
  });
  el.innerHTML = `<button class="overlay" data-action="hist-close" aria-label="Schließen" tabindex="-1"></button>
    <div class="sheet tall" role="dialog" aria-modal="true" aria-labelledby="hiTitle">
      <h2 id="hiTitle">Dialogverlauf</h2>
      <p class="muted">${msgs.length} Nachrichten gespeichert, höchstens die letzten 80.</p>
      <div class="hist" id="histBox">${body || '<p class="muted">Noch keine Nachrichten.</p>'}</div>
      ${histDlg.confirm
        ? `<p>Den gesamten Dialog löschen? Plan, Ziel, Erkenntnisse und Aktivitäten bleiben erhalten.</p><div class="row end"><button class="btn" data-action="hist-del-no">Abbrechen</button><button class="btn primary" data-action="hist-del-yes">Löschen</button></div>`
        : `<div class="row end">${msgs.length?'<button class="btn" data-action="hist-del">Verlauf löschen</button>':''}<button class="btn primary" data-action="hist-close">Fertig</button></div>`}
    </div>`;
  const box = document.getElementById('histBox'); if(box) box.scrollTop = box.scrollHeight;
}
const insights = () => (profile().insights||[]).filter(Boolean);
function setInsights(list){
  const pr = S.profile || (S.profile = JSON.parse(JSON.stringify(profile())));
  pr.insights = list.map(x=>String(x).trim().slice(0,200)).filter(Boolean).slice(0,25);
  save('profile');
}
function renderInsightDialog(el){
  const list = insights();
  el.innerHTML = `<button class="overlay" data-action="ins-close" aria-label="Schließen" tabindex="-1"></button>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="inTitle">
      <h2 id="inTitle">Erkenntnisse</h2>
      <p class="muted">Dauerhafte Beobachtungen, die Claude bei jeder Planung berücksichtigt. Claude ergänzt sie selbst, du kannst sie ändern oder löschen.</p>
      ${list.length?`<ul class="ins">${list.map((x,i)=> insightDlg.edit===i
        ? `<li><textarea id="insEdit" rows="2" aria-label="Erkenntnis bearbeiten">${esc(x)}</textarea><div class="row end"><button class="btn" data-action="ins-edit-no">Abbrechen</button><button class="btn primary" data-action="ins-edit-yes" data-i="${i}">Speichern</button></div></li>`
        : `<li><span>${esc(x)}</span><span class="ia"><button class="ib" data-action="ins-edit" data-i="${i}" aria-label="Bearbeiten">✎</button><button class="ib" data-action="ins-del" data-i="${i}" aria-label="Löschen">×</button></span></li>`).join('')}</ul>`
        :`<p class="empty">Noch keine Erkenntnisse. Claude legt sie im Laufe der Zeit an. Du kannst Claude auch bitten, sie jetzt aus deinen bisherigen Daten abzuleiten.</p>`}
      <div class="addrow"><input id="insNew" type="text" placeholder="z. B. Bergab über 5 % reizt das Knie" aria-label="Erkenntnis hinzufügen"><button class="btn" data-action="ins-add">Hinzufügen</button></div>

    <div class="card-head"><span class="tag ${rest?'':'plan'}">${esc(label||'Geplant')}</span><span class="sport">${esc(SPORT[normSport(s.sport)])}</span></div>

function doneCard(a, planned, extra){
  const f = fb(a.id), as = assess(a.id);
  const run = a.sport==='run' || a.sport==='walk';
  const m = [
    ['Distanz', fmtNum(a.distKm,2)+' km'],
    ['Bewegungszeit', fmtDur(a.movingS)],
    run ? ['Pace /km', fmtPace(a.distKm,a.movingS)] : ['Ø km/h', fmtNum(a.distKm/(a.movingS/3600||1),1)],
    ['Höhenmeter', Math.round(a.elev||0)+' m'],
    run ? ['Schritte /min', a.cadence? Math.round(a.cadence*2):'–'] : ['Kadenz', a.cadence? Math.round(a.cadence)+' U/min':'–'],
    ['Relative Effort', a.re ?? '–']
  ];
  const chips = [];
  if(f){
    if(f.painDuring!=null) chips.push(`<span class="chip ${painClass(f.painDuring)}">Schmerz während ${f.painDuring}/10</span>`);
    if(f.painAfter!=null) chips.push(`<span class="chip ${painClass(f.painAfter)}">danach ${f.painAfter}/10</span>`);
    if(f.rpe!=null) chips.push(`<span class="chip">Belastung ${f.rpe}/10</span>`);
    if(f.note) chips.push(`<span class="chip">${esc(f.note)}</span>`);
  }
  return `<article class="card">
    <div class="card-head"><span class="tag ${extra?'extra':'done'}">${extra?'Zusätzlich':'Absolviert'}</span><span class="sport">${esc(SPORT[a.sport]||a.type)} · ${esc(a.time||'')} Uhr</span></div>
    <h3>${esc(a.name)}</h3>
    <div class="metrics">${m.map(([k,v])=>`<div class="metric"><span class="v">${esc(v)}</span><span class="k">${esc(k)}</span></div>`).join('')}</div>
    ${perfBlock(a)}
    ${chips.length?`<div class="chips">${chips.join('')}</div>`:`<div class="row"><span class="note">Noch keine Rückmeldung zu ${careMode()?'Beschwerden':'Befinden'} und Belastung.</span><button class="btn ghost" data-action="prefill" data-text="${esc(fbTemplate(a.date))}">Rückmeldung geben</button></div>`}
    ${as?`<div class="assess"><b>Einschätzung</b><div class="md">${md(as.text)}</div></div>`:`<button class="btn" data-action="assess" data-id="${esc(a.id)}" ${sample&&!busy?'':'disabled'}>Einschätzung von Claude anfordern</button>`}
    ${planned?`<p class="planref">Geplant war: <b>${esc(planned.title||'')}</b>${planned.distanceKm?' · '+fmtNum(planned.distanceKm, planned.distanceKm%1?1:0)+' km':''}</p>`:''}
  </article>`;
}

function perfBlock(a){
  if(a.sport!=='run' && a.sport!=='ride') return '';
  const r = analyze(a);
  if(!r) return `<div class="perf"><b>Leistung</b><span class="note">Noch keine Leistungsdaten. Sie kommen beim nächsten Strava-Abgleich.</span></div>`;
  const c = [];
  if(r.hr) c.push(`<span class="chip">Ø HF ${Math.round(r.hr)}${r.zone?' · Z'+r.zone:''}</span>`);
  if(r.effect) c.push(`<span class="chip">Effekt: ${esc(r.effect)}</span>`);
  if(r.tiz) c.push(`<span class="chip">${r.tiz.map((v,i)=>v?`Z${i+1} ${v} %`:'').filter(Boolean).join(' · ')}</span>`);
  if(r.ef) c.push(`<span class="chip">Effizienz ${fmtNum(r.ef,2)}</span>`);
  if(r.decoupling!=null) c.push(`<span class="chip ${decClass(r.decoupling)}">Entkopplung ${fmtNum(r.decoupling,1)} %</span>`);
  if(r.if) c.push(`<span class="chip">IF ${fmtNum(r.if,2)} · TSS ${r.tss}</span>`);
  const L = loadAt(a.date), [cls,lbl] = acwrInfo(L.acwr);
  c.push(`<span class="chip ${cls}">Belastung 7/28 Tage ${L.acwr==null?'–':fmtNum(L.acwr,2)} · ${lbl}</span>`);
  return `<div class="perf"><b>Leistung</b><div class="chips">${c.join('')}</div></div>`;
}

function loadChart(mon){
  const weeks = []; for(let i=7;i>=0;i--) weeks.push(addDays(mon,-7*i));
  const vals = weeks.map(w=>weekStats(w).re);
  const max = Math.max(1,...vals);
  return `<div class="lc" role="img" aria-label="Relative Effort der letzten 8 Wochen">${weeks.map((w,i)=>
    `<div class="lcol ${i===7?'sel':''}"><span class="lv">${vals[i]||''}</span><span class="lb" style="height:${Math.round(vals[i]/max*36)}px"></span><span class="lk">${isoWeek(w)}</span></div>`).join('')}</div>`;
}

function renderToday(){
  if(!S.loaded) return syncBlock()+`<div class="empty">Trainingsdaten werden geladen …</div>`;
  const t = today();
  const planned = active().filter(s => s.date===t);
  const cancelledToday = sessions().filter(s => s.date===t && s.cancelled);
  const done = acts().filter(a => a.date===t);
  const used = new Set(); const out = [];
  planned.forEach(p => {
    const d = done.find(a => !used.has(a.id) && a.sport===normSport(p.sport));
    if(d){ used.add(d.id); out.push(doneCard(d,p,false)); } else out.push(plannedCard(p,'Geplant · heute'));
  });
  done.filter(a=>!used.has(a.id)).forEach(a => out.push(doneCard(a,null,planned.length>0 || true)));
  cancelledToday.forEach(s => out.push(cancelledCard(s)));
  if(!planned.length && !done.length){
    const next = active().filter(s => s.date>t).sort((a,b)=>a.date<b.date?-1:1)[0];
    if(!cancelledToday.length) out.push(`<div class="card rest"><p class="eyebrow">Heute</p><h3>Kein Training geplant</h3><p class="muted">Ruhetag. Wenn du trotzdem etwas machst, gleiche danach mit Strava ab.</p></div>`);
    if(next) out.push(plannedCard(next, 'Nächstes Training · '+fmtDay(next.date)));
    else out.push(`<div class="empty">Es gibt noch keinen Plan. Bitte Claude unten im Dialog, einen Plan für die nächsten zwei Wochen zu erstellen.</div>`);
  }
  return syncBlock() + out.join('');
}

const GLOSSAR = `<dl class="gloss">
  <div><dt>RE · Relative Effort</dt><dd>Stravas Belastungswert pro Einheit, berechnet aus der Zeit in den Herzfrequenz-Zonen. Höhere Zonen zählen überproportional, deshalb sind Laufen und Rad vergleichbar. Die Balken zeigen die Wochensumme.</dd></div>
  <div><dt>Verhältnis 7 / 28 Tage</dt><dd>Relative Effort der letzten 7 Tage geteilt durch den Wochenschnitt der letzten 28 Tage. Unter 0,8 Entlastung, 0,8–1,3 im Rahmen, 1,3–1,5 erhöht, darüber hoch. Nach einer Pause fällt der Wert schnell hoch aus, weil der 28-Tage-Schnitt noch niedrig ist.</dd></div>
  <div><dt>Lauf-Effizienz</dt><dd>Meter pro Minute je Herzschlag. Höher heißt gleiches Tempo bei niedrigerem Puls. Auf Trails schwankt der Wert mit den Höhenmetern.</dd></div>
  <div><dt>Entkopplung</dt><dd>Vergleicht Tempo pro Herzschlag in der ersten und zweiten Laufhälfte (ohne ersten Kilometer). Unter 5 % trägt die Grundlage die Dauer, 5–10 % spürbare Ermüdung, über 10 % war die Einheit für die aktuelle Form zu lang oder zu intensiv.</dd></div>
  <div><dt>IF · Intensity Factor</dt><dd>Durchschnittliche Wattleistung geteilt durch deine FTP. Unter 0,75 locker, 0,75–0,85 zügig, 0,85–0,95 Tempo bis Schwelle, um 1,0 Schwelle.</dd></div>
  <div><dt>TSS · Training Stress Score</dt><dd>Stunden × IF² × 100. Eine Stunde genau an der FTP ergibt 100.</dd></div>
</dl>`;
function lastWeekOffset(){
  const last = acts().map(a=>a.date).filter(d=>d<=today()).sort().pop();
  return last ? Math.round((parseYmd(mondayOf(today()))-parseYmd(mondayOf(last)))/(7*86400000)) : 0;
}
let weekInit = false;
function renderHistory(){
  if(S.loaded && !weekInit){ weekInit = true; weekOffset = lastWeekOffset(); }
  if(!S.loaded) return `<div class="empty">Trainingsdaten werden geladen …</div>`;
  const cur = mondayOf(today());
  const mon = addDays(cur, -7*weekOffset), sun = addDays(mon,6);
  const first = earliestMonday();
  const label = weekOffset===0 ? 'Diese Woche' : weekOffset===1 ? 'Letzte Woche' : 'KW '+isoWeek(mon);
  const range = `KW ${isoWeek(mon)} · ${parseYmd(mon).getDate()}.${parseYmd(mon).getMonth()+1}.–${parseYmd(sun).getDate()}.${parseYmd(sun).getMonth()+1}.${parseYmd(sun).getFullYear()}`;
  const wa = acts().filter(a=>a.date>=mon && a.date<=sun).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const runs = wa.filter(a=>a.sport==='run');
  const runKm = runs.reduce((s,a)=>s+a.distKm,0), runS = runs.reduce((s,a)=>s+a.movingS,0);
  const hm = runs.reduce((s,a)=>s+(a.elev||0),0);
  const otherMin = Math.round(wa.filter(a=>a.sport==='ride'||a.sport==='strength').reduce((s,a)=>s+a.movingS,0)/60);
  const pains = wa.map(a=>fb(a.id)).filter(Boolean).flatMap(f=>[f.painDuring,f.painAfter]).filter(v=>v!=null);
  const maxPain = pains.length ? Math.max(...pains) : null;
  const metrics = [
    ['Lauf-km', fmtNum(runKm,1)], ['Läufe', runs.length], ['Ø Pace /km', runs.length?fmtPace(runKm,runS):'–'],
    ['Höhenmeter Lauf', Math.round(hm)+' m'], ['Rad / Kraft', otherMin?otherMin+' min':'–'], ['Max. Schmerz', maxPain==null?'–':maxPain+'/10']
  ];
  // Tageseinträge: absolvierte Einheiten plus geplante, aber ausgelassene Einheiten (nur vergangene Tage)
  const t = today(); const rows = [];
  for(let i=0;i<7;i++){
    const d = addDays(mon,i);
    const done = wa.filter(a=>a.date===d);
    const planned = active().filter(s=>s.date===d);
    const cancelledD = sessions().filter(s=>s.date===d && s.cancelled);
    const used = new Set();
    done.forEach(a => {
      const p = planned.find(s=>!used.has(s) && normSport(s.sport)===a.sport); if(p) used.add(p);
      const f = fb(a.id), as = assess(a.id);
      const run = a.sport==='run'||a.sport==='walk';
      const facts = [fmtNum(a.distKm,1)+' km', run?fmtPace(a.distKm,a.movingS)+' /km':fmtNum(a.distKm/(a.movingS/3600||1),1)+' km/h', Math.round(a.elev||0)+' hm'].join(' · ');
      const chips = [];
      if(f && f.painDuring!=null) chips.push(`<span class="chip ${painClass(f.painDuring)}">Schmerz ${f.painDuring}${f.painAfter!=null?' / '+f.painAfter:''}</span>`);
      else if(f && f.painAfter!=null) chips.push(`<span class="chip ${painClass(f.painAfter)}">danach ${f.painAfter}/10</span>`);
      if(f && f.rpe!=null) chips.push(`<span class="chip">RPE ${f.rpe}</span>`);
      const short = as ? (as.short || as.text) : (f && f.note) || '';
      const r = analyze(a); let pl = '';
      if(r){
        const parts = [];
        if(r.hr) parts.push('HF '+Math.round(r.hr)+(r.zone?' (Z'+r.zone+')':''));
        if(r.effect) parts.push(r.effect);
        if(r.ef) parts.push('Effizienz '+fmtNum(r.ef,2));
        if(r.decoupling!=null) parts.push('Entkopplung '+fmtNum(r.decoupling,1)+' %');

        if(a.re) parts.push('RE '+a.re);

      } else if(a.re) pl = 'RE '+a.re;
      rows.push(`<div class="entry"><div class="dl"><b>${WD[parseYmd(d).getDay()]}</b><span>${parseYmd(d).getDate()}.${parseYmd(d).getMonth()+1}.</span></div>
        <div class="body"><span class="facts">${esc(SPORT[a.sport])} <span class="s">·</span> ${esc(facts)}</span>
        ${pl?`<span class="pl">${esc(pl)}</span>`:''}
        ${chips.length?`<div class="chips">${chips.join('')}</div>`:''}
        ${short?`<p class="short">${esc(short)}</p>`:''}${p?`<span class="note">Geplant: ${esc(p.title)}</span>`:''}</div></div>`);
    });
    planned.filter(s=>!used.has(s) && d<t).forEach(s => rows.push(`<div class="entry missed"><div class="dl"><b>${WD[parseYmd(d).getDay()]}</b><span>${parseYmd(d).getDate()}.${parseYmd(d).getMonth()+1}.</span></div>
      <div class="body"><span class="facts">Ausgelassen: ${esc(s.title)}</span></div></div>`));
    cancelledD.forEach(s => rows.push(`<div class="entry missed"><div class="dl"><b>${WD[parseYmd(d).getDay()]}</b><span>${parseYmd(d).getDate()}.${parseYmd(d).getMonth()+1}.</span></div>
      <div class="body"><span class="facts">Abgesagt: ${esc(s.title)}</span>${s.cancelled.reason?`<span class="pl">Grund: ${esc(s.cancelled.reason)}</span>`:''}</div></div>`));
  }
  const ws = weekSummary(mon);
  const msgs = ((S.chat&&S.chat.messages)||[]).filter(m=>!m.error && m.ts && ymd(new Date(m.ts))>=mon && ymd(new Date(m.ts))<=sun).length;
  return `<div class="weeknav">
      <button data-action="week-prev" aria-label="Vorherige Woche" ${mon<=first?'disabled':''}>‹</button>
      <div class="wl"><b>${esc(label)}</b><span>${esc(range)}</span></div>
      <button data-action="week-next" aria-label="Nächste Woche" ${weekOffset===0?'disabled':''}>›</button>
    </div>
    <div class="card"><div class="wsum">${metrics.map(([k,v])=>`<div class="metric"><span class="v">${esc(v)}</span><span class="k">${esc(k)}</span></div>`).join('')}</div></div>
    ${(() => { const st=weekStats(mon), pv=weekStats(addDays(mon,-7)); const [cls,lbl]=acwrInfo(st.acwr);
      const efd = st.ef && pv.ef ? (st.ef-pv.ef)/pv.ef*100 : null;
      return `<div class="card"><div class="row"><div class="ht"><h2>Belastung und Form</h2><button class="info" data-action="info" aria-expanded="${infoOpen}" aria-label="Erklärung der Kennzahlen">i</button></div><span class="badge ${cls}">Belastung ${lbl}</span></div>
        ${loadChart(mon)}
        <div class="wsum">
          <div class="metric"><span class="v">${st.re}</span><span class="k">Relative Effort (Woche)</span></div>
          <div class="metric"><span class="v">${st.acwr==null?'–':fmtNum(st.acwr,2)}</span><span class="k">Verhältnis 7 / 28 Tage</span></div>
          <div class="metric"><span class="v">${st.ef?fmtNum(st.ef,2):'–'}</span><span class="k">Lauf-Effizienz${efd!=null?` (${efd>=0?'+':''}${fmtNum(efd,1)} % zur Vorwoche)`:''}</span></div>
        </div>
        ${infoOpen?GLOSSAR:''}</div>`; })()}
    <div class="card"><div class="row"><h2>Wochenfazit</h2>${msgs?`<span class="note">${msgs} Dialognachrichten in dieser Woche</span>`:''}</div>
      ${ws?`<div class="summary md">${md(ws.text)}</div>`:`<p class="muted">Noch kein Fazit für diese Woche.</p>`}
      ${wa.length?`<div><button class="btn" data-action="week-summary" data-mon="${mon}" ${sample&&!busy?'':'disabled'}>${ws?'Fazit aktualisieren':'Fazit von Claude erstellen'}</button></div>`:''}</div>

/* Vorschläge im Dialogfeld: aus der aktuellen Lage abgeleitet (Regeln, kein Claude-Aufruf) */
function suggestions(){
  const t = today(), out = [];
  const add = (label, text) => out.push({label, text: text ?? label});
  const noFb = a => { const f=fb(a.id); return !f || (f.painDuring==null && f.painAfter==null && f.rpe==null); };
  if(tab==='heute'){
    const planned = active().filter(s=>s.date===t);
    const doneToday = acts().filter(a=>a.date===t);
    const open = planned.filter(p=>!doneToday.some(a=>a.sport===normSport(p.sport)));
    if(open.length) add('Wie sieht das heutige Training genau aus?');
    else if(!planned.length && !doneToday.length) add('Ich möchte heute doch etwas machen.', 'Ich möchte heute doch etwas machen: ');
    const pending = acts().filter(a=>a.sport==='run' && a.date>=addDays(t,-3) && noFb(a))[0];
    if(pending) add(`Rückmeldung zum ${a2s(pending)} vom ${fmtDay(pending.date)} geben`, fbTemplate(pending.date));
    if(careMode()) add(`${complaints()[0]} heute …`, `${complaints()[0]}: Heute fühlt es sich `);
    else add('Wie ich mich heute fühle …', 'Heute fühle ich mich ');
  } else if(tab==='plan'){
    const pr = profile();
    if(!pr.goal || !pr.goal.text) add('Ziel festlegen', 'Mein Ziel ist ');
    const since = S.plan && S.plan.updatedAt ? S.plan.updatedAt.slice(0,10) : '';
    if(acts().some(a=>(a.sport==='run'||a.sport==='ride') && a.date>=since)) add('Passe den Plan an meine letzten Einheiten an.');
    const L = loadAt(t); if(L.acwr!=null && L.acwr>1.3) add('Ist meine Belastung gerade zu hoch?');
    const lastPlanned = active().map(s=>s.date).sort().pop();
    if(!lastPlanned || lastPlanned < addDays(t,7)) add('Plan verlängern', 'Bitte verlängere den Plan auf die nächsten 14 Tage.');
    if(out.length<2) add('Warum diese Steigerung?');
    if(out.length<2) add('Passt meine Belastung gerade?');
  } else if(tab==='rueckblick'){
    const mon = addDays(mondayOf(t), -7*weekOffset);
    const hasActs = acts().some(a=>a.date>=mon && a.date<=addDays(mon,6));
    if(hasActs && !weekSummary(mon)) out.push({label:'Fazit für diese Woche erstellen', action:'week-summary', mon});
    add('Wie entwickelt sich meine Form?');
    if(weekOffset>0 || hasActs) add('Vergleiche diese Woche mit der Vorwoche.', `Vergleiche die Woche ab ${fmtDay(mon)} mit der Vorwoche.`);
  } else {
    add('Trainingstage ändern', 'Ich möchte an folgenden Tagen trainieren: ');
    add('Sportart ergänzen', 'Nimm bitte zusätzlich ');
  }
  return out.slice(0,3);
}

/* ---------- Strava ---------- */
function compact(a){
  const s = a.summary||{};
  return {id:String(a.id), date:String(a.start_local||'').slice(0,10), time:String(a.start_local||'').slice(11,16), name:a.name||'Aktivität',
    type:a.sport_type||'', sport:sportOf(a.sport_type), distKm:Math.round((s.distance||0)/10)/100, movingS:s.moving_time||0,
    elev:s.elevation_gain||0, re:s.relative_effort??null, cadence:s.avg_cadence?Math.round(s.avg_cadence*10)/10:null};
}
async function syncStrava(){
  if(!mcp || syncBusy) return;
  syncBusy=true; syncMsg=null; render();
  try{
    const start = addDays(today(),-60)+'T00:00:00';
    const r = await mcp.callTool(SERVER,'list_activities',{first:100, range_start:start},{cache:false});
    const list = (r && r.payload && Array.isArray(r.payload.activities)) ? r.payload.activities : [];
    const log = S.log || (S.log={activities:[], feedback:{}, assessments:{}});
    log.activities = log.activities||[]; log.feedback = log.feedback||{}; log.assessments = log.assessments||{};
    const known = new Set(log.activities.map(a=>a.id));
    const incoming = list.map(compact);
    const fresh = incoming.filter(a=>!known.has(a.id));
    const byId = new Map(log.activities.map(a=>[a.id,a])); incoming.forEach(a=>byId.set(a.id, Object.assign({}, byId.get(a.id)||{}, a)));
    log.activities = [...byId.values()].sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time)).slice(0,120);
    log.lastSync = new Date().toISOString();
    try{
      const z = (await mcp.callTool(SERVER,'get_athlete_zones',{},{cache:false})).payload || {};
      if(Array.isArray(z.heart_rate_zones)) log.zones = {hrMins: z.heart_rate_zones.map(x=>x.min||0), ftp: z.ftp||null};
    }catch(_){}
    const need = log.activities.filter(a=>(a.sport==='run'||a.sport==='ride') && !a.perf && daysUntil(a.date)>=-60).slice(0,15);
    for(let i=0;i<need.length;i++){
      syncMsg = {text:`Leistungsdaten ${i+1} von ${need.length} …`}; render();
      try{
        const p = (await mcp.callTool(SERVER,'get_activity_performance',{activity_id:need[i].id},{cache:false})).payload || {};
        need[i].perf = {hr:p.has_heartrate&&p.average_heartrate?Math.round(p.average_heartrate*10)/10:null, hrMax:p.max_heartrate||null,
          watts:p.average_watts?Math.round(p.average_watts):null, deviceWatts:!!p.has_device_watts,
          laps:(p.laps||[]).slice(0,60).map(l=>({d:Math.round(l.distance||0), s:l.moving_time||0, hr:l.avg_hr?Math.round(l.avg_hr*10)/10:null, g:l.avg_grade!=null?Math.round(l.avg_grade*10)/10:null, w:l.avg_watts?Math.round(l.avg_watts):null}))};
      }catch(err){ if(['needs_reauth','server_not_connected','not_in_manifest','consent_required'].includes(err&&err.code)) break; }
    }
    // in den aktuellen Stand übernehmen (Rückmeldungen/Fazits können sich währenddessen geändert haben)
    const cur = S.log || {};
    S.log = Object.assign({}, cur, {activities: log.activities, zones: log.zones || cur.zones, lastSync: log.lastSync});
    await save('log');
    syncMsg = {text: fresh.length ? fresh.length+(fresh.length===1?' neue Aktivität':' neue Aktivitäten')+' übernommen.' : 'Keine neuen Aktivitäten.'};
    syncBusy=false; render();
    setTimeout(checkMissed, 1500);
    const recent = fresh.filter(a => a.sport!=='walk' && daysUntil(a.date) >= -10);
    if(recent.length && sample && sampleState!=='denied' && !busy){
      const desc = recent.map(a=>`${fmtDay(a.date)} ${SPORT[a.sport]} „${a.name}“ ${fmtNum(a.distKm,2)} km (ID ${a.id})`).join('; ');
      askClaude('Strava-Abgleich: '+desc+'. Bitte einschätzen, nach Schmerz und Belastung fragen und den Plan bei Bedarf anpassen.', {auto:true});
    }
  }catch(e){
    const c = e && e.code;
    const t = c==='server_not_connected' ? (IN_APP?'Strava ist nicht verbunden. Verbinde Strava in den Einstellungen unter „Verbindungen“.':'Strava ist nicht verbunden. Füge den Strava-Konnektor in claude.ai unter Einstellungen → Konnektoren hinzu.')
      : c==='needs_reauth' ? (IN_APP?'Die Strava-Anmeldung ist abgelaufen. Verbinde Strava in den Einstellungen neu.':'Die Strava-Verbindung ist abgelaufen. Verbinde Strava in claude.ai unter Einstellungen → Konnektoren neu.')
      : c==='not_in_manifest' || c==='consent_required' ? 'Du hast der App den Zugriff auf Strava nicht erlaubt. Erlaube ihn über das Berechtigungsmenü der App.'
      : c==='selection_required' ? 'Es gibt mehrere Strava-Verbindungen. Wähle eine aus, wenn claude.ai danach fragt.'
      : c==='server_unavailable' ? 'Strava antwortet gerade nicht. Versuche es in ein paar Minuten erneut.'
      : c==='approval_required' ? 'Der Abruf braucht deine Freigabe. Tippe erneut auf „Mit Strava abgleichen“ und erlaube ihn.'
      : 'Abgleich fehlgeschlagen: '+((e&&e.message)||'unbekannter Fehler');
    syncMsg = {err:true, text:t}; syncBusy=false; render();
  }
}

/* ---------- Claude ---------- */
function buildContext(){
  const pr = profile(), t = today();
  const since = addDays(t,-42);
  const al = acts().filter(a=>a.date>=since).map(a=>{
    const f=fb(a.id), as=assess(a.id);
    const r = analyze(a), L = loadAt(a.date);
    const leistung = r ? {hfAvg:r.hr, hfMax:a.perf.hrMax, hfZone:r.zone, effekt:r.effect, zonenAnteilProzent:r.tiz, effizienz:r.ef?Math.round(r.ef*1000)/1000:undefined,
      entkopplungProzent:r.decoupling!=null?Math.round(r.decoupling*10)/10:undefined, IF:r.if?Math.round(r.if*100)/100:undefined, TSS:r.tss,
      splits:(a.perf.laps||[]).map(l=>`${fmtPace(l.d/1000,l.s)}/km ${l.hr||'–'}bpm ${l.g??0}%`).join(' | ')} : undefined;
    return {id:a.id, datum:a.date, sport:a.sport, name:a.name, km:a.distKm, minuten:Math.round(a.movingS/60), pace:a.sport==='run'?fmtPace(a.distKm,a.movingS):undefined, hm:a.elev, relativeEffort:a.re,
      belastung7zu28:L.acwr!=null?Math.round(L.acwr*100)/100:undefined, leistung, rueckmeldung:f||undefined, einschaetzung:as?as.text:undefined};
  });
  const wochen = []; for(let i=5;i>=0;i--){ const m=addDays(mondayOf(t),-7*i), st=weekStats(m); wochen.push({woche:m, laufKm:Math.round(st.km*10)/10, relativeEffort:st.re, belastung7zu28:st.acwr!=null?Math.round(st.acwr*100)/100:null, laufEffizienz:st.ef?Math.round(st.ef*1000)/1000:null}); }
  const zones = S.log && S.log.zones;
  const plan = sessions().filter(s=>s.date>=addDays(t,-7));
  const nm = userName(), care = careMode(), cl = complaints().join(', ');
  return [
`Du bist Claude und arbeitest als Trainingsbegleiter in der Trainings-App von ${nm}. Schwerpunkt ist Laufen, andere Sportarten werden ergänzend geplant. ${care ? `${nm} trainiert mit Beschwerden: ${cl}. Die Sicherheit der betroffenen Stellen geht vor Leistung.` : `Es sind keine Beschwerden eingetragen. Plane leistungsorientiert auf das Ziel hin.`}

Regeln:
- Antworte auf Deutsch, direkt, knapp und fachlich präzise. Formatierung sparsam: kurze Absätze, bei Bedarf Aufzählungen mit „- “ und **fett** für Stichwörter; keine Überschriften, Tabellen oder Links. Keine Diagnosen; bei neu auftretenden, anhaltenden oder zunehmenden Schmerzen zur ärztlichen oder physiotherapeutischen Abklärung raten.
${care ? `- Schmerz an der betroffenen Stelle bis 2/10 während der Belastung und am Folgetag abgeklungen gilt als akzeptabel. Darüber oder bei unklaren Signalen: nicht steigern, Umfang reduzieren oder Ersatztraining mit weniger Belastung für die betroffene Stelle einplanen.
- Steigerung höchstens 10–15 % pro Woche, geplante Entlastungswochen einhalten, für die Beschwerden kritische Belastungen (z. B. bergab bei Kniebeschwerden) anfangs entschärfen.
- Wenn zu einer neuen Aktivität keine Rückmeldung zu Schmerz (während/danach) und Belastung (RPE 1–10) vorliegt, frage danach.`
: `- Periodisiere auf das Ziel hin: Aufbauwochen mit regelmäßigen Entlastungswochen (z. B. 3:1), Wochenumfang höchstens etwa 10 % steigern.
- Intensitätsverteilung: etwa 80 % locker (Z1–Z2), der Rest gezielte Reize (Schwelle, Intervalle, Zieltempo). Harte Einheiten nicht an aufeinanderfolgenden Tagen.
- Leite Zieltempi aus Ziel, Leistungsstand und Daten ab und gib Intervalle mit Pace oder HF-Zone an.
- Wenn zu einer neuen Aktivität keine Rückmeldung zu Belastung (RPE 1–10) und Befinden vorliegt, frage danach. Treten Schmerzen auf, frage, ob du sie als Beschwerde eintragen sollst.`}
- Stelle höchstens eine Rückfrage pro Antwort.
- Einen Plan erstellst oder änderst du für die 14 Tage ab heute (${t}). Nutze für Wochentage ausschließlich den mitgelieferten KALENDER, rechne sie nie selbst aus. Plane nur an Tagen, die dort als Trainingstag markiert sind. Trainingstage sind verfügbare Tage, keine Pflicht: Lass einen Trainingstag frei oder setze ausdrücklich einen Ruhetag ("sport":"rest", Titel z. B. „Ruhetag“, im Ziel kurz warum), wenn Erholung, Beschwerden, Belastung (z. B. Verhältnis 7/28 hoch) oder eine anstehende längere Einheit das sinnvoll machen. Weniger Einheiten mit guter Qualität sind besser als volle Wochen. Nur wenn ${nm} ausdrücklich eine Einheit an einem anderen Tag wünscht, plane sie dort und setze "extra":true. Will ${nm} im Dialog eine Einheit verschieben, setze sie mit "extra":true auf den neuen Tag und plane am alten Tag nichts; passe angrenzende Einheiten an (Abstand, Umfang, ggf. kürzen und dafür andere verlängern). Gilt eine Verhinderung dauerhaft (z. B. „donnerstags nie“), schlage vor, die Trainingstage zu ändern. Jede Einheit hat Titel, Sportart, Ziel der Einheit und konkrete Schritte (Einlaufen, Intervalle, Pausen, Auslaufen, Kraftübungen).
- Ausgelassene Einheiten: Holst du sie nicht stur nach. Entscheide, ob der Inhalt wichtig genug ist, um ihn (ggf. gekürzt) auf einen späteren Trainingstag zu legen, oder ob er entfällt. Erhöhe dafür nicht die Belastung der Folgetage über das sinnvolle Maß. Wurde stattdessen eine andere Sportart trainiert, rechne diese an.
- Erkenntnisse: Führe eine Liste dauerhafter, für die Planung relevanter Beobachtungen (was Beschwerden auslöst oder lindert, gut vertragene Umfänge und Intensitäten, Vorlieben, Rahmenbedingungen). Ergänze sie, wenn du aus Daten oder Dialog etwas Dauerhaftes lernst, korrigiere veraltete Punkte, fasse zusammen statt zu wiederholen, höchstens 20 Punkte zu je einer kurzen Zeile. Liefere "insights" nur, wenn sich etwas ändert, und dann immer die vollständige Liste. Einmalige Tagesbefunde gehören nicht hinein.
- Ändern sich Ziel, Trainingstage, Sportarten, Beschwerden oder Leistungsstand (im Dialog oder in den Einstellungen), lieferst du im selben Schritt einen angepassten Plan und erklärst die Änderung kurz in der Begründung.
- Name, Ziel, Trainingstage, Sportarten, Beschwerden, Leistungsstand und Hintergrund werden über diesen Dialog festgelegt. Übernimm Änderungen nur, wenn ${nm} sie klar äußert. Eine Beschwerde entfernst du nur auf ausdrücklichen Wunsch.
- Leistungsaussagen: Eine Einschätzung behandelt ${care?'neben den Beschwerden ':''}Belastung und Trainingswirkung. Stütze dich auf die gelieferten Kennzahlen und nenne Zahlen sparsam:
  · Belastung: Relative Effort der Einheit und Verhältnis 7/28 Tage (unter 0,8 Entlastung, 0,8–1,3 im Rahmen, 1,3–1,5 erhöht, darüber hoch).${care?' Bei Beschwerden gilt ein hohes Verhältnis zusätzlich als Risiko für die betroffene Stelle.':''}
  · Trainingseffekt: HF-Zonen und Zeitanteile (Z1 Regeneration, Z2 Grundlage, Z3 aerob intensiv, Z4 Schwelle, Z5 VO2max). Benenne, welcher Reiz gesetzt wurde und ob er zum Ziel der Einheit passt.
  · Effizienz (Meter/Minute je Herzschlag) und Entkopplung Pace:HF (unter 5 % stabile Grundlage, 5–10 % Ermüdung, darüber deutlich). Auf Trails mit Höhenmetern und Steigung pro Split vorsichtig interpretieren.
  · Rad: IF und TSS bezogen auf die FTP.
  · Formentwicklung über die Wochen (Effizienz, Belastung) nur mit Vorsicht, solange wenige Daten vorliegen.
- Wenn du eine Aktivität auswertest oder Rückmeldungen erhältst, aktualisiere das Wochenfazit der betroffenen Woche (Schlüssel = Montag der Woche, YYYY-MM-DD): 2–5 Sätze in Stichworten zu Umfang, ${care?'Beschwerdesignalen':'Befinden'}, Belastung und Trainingswirkung, Auswertung und was im Dialog besprochen oder entschieden wurde. Ein bestehendes Fazit ergänzt du, statt es zu verlieren.
- Ändere nur, was sich wirklich ändert; lass andere Felder in "updates" weg.

{"reply":"Text an ${nm}",
 "updates":{

  ].join('\n\n');
