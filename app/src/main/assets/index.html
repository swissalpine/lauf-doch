  }
  else if(a==='rpe-set'){
    const log = S.log || (S.log={activities:[], feedback:{}, assessments:{}});
    log.feedback = log.feedback||{};
    log.feedback[b.dataset.id] = Object.assign({}, log.feedback[b.dataset.id], {rpe:Number(b.dataset.v), ts:new Date().toISOString()});
    render(); await save('log');
    fbChanged(b.dataset.id);
  }
  else if(a==='guide'){ e.preventDefault(); const st={label:b.dataset.label, detail:b.dataset.detail}; guideDlg={label:st.label, detail:st.detail, key:guideKey(st), loading:false, error:null}; renderMoveDialog(); loadGuide(false); }
  else if(a==='guide-close'){ guideDlg=null; renderMoveDialog(); }
  else if(a==='guide-redo'){ loadGuide(true); }
  else if(a==='goal-open'){ const g = profile().goal||{}; goalDlg={text:g.text||'', date:g.date||''}; renderMoveDialog(); }
  else if(a==='goal-close'){ goalDlg=null; renderMoveDialog(); }
  else if(a==='goal-save'){
    const txt = (goalDlg.text||'').trim().slice(0,200), dt = isDate(goalDlg.date) ? goalDlg.date : null;
    const pr = S.profile || (S.profile = JSON.parse(JSON.stringify(profile())));
    const old = pr.goal || {}; goalDlg=null; renderMoveDialog();
    if(txt===(old.text||'') && dt===(old.date||null)) return;
    pr.goal = txt ? {text:txt, date:dt} : null; await save('profile'); render();
    const desc = txt ? `„${txt}“${dt?' bis '+dmyy(dt):' ohne festes Datum'}` : 'entfernt';
    if(sample && !busy) askClaude(`Ich habe mein Ziel geändert: ${desc}. Bitte passe den Gesamtplan (vollständig unter "macro"${dt?'':', Enddatum realistisch schätzen'}) und den Plan bis Ende nächster Woche daran an.`, {overlay:true, display:`Ziel geändert: ${desc}`});
    else { markChange('goal', 'Ziel: '+desc); render(); }
  }
  else if(a==='bg-open'){ bgDlg={edit:false}; renderMoveDialog(); }
  else if(a==='bg-close'){ bgDlg=null; renderMoveDialog(); }
  else if(a==='bg-edit'){ bgDlg.edit=true; renderMoveDialog(); }
  else if(a==='bg-edit-no'){ bgDlg.edit=false; renderMoveDialog(); }
  else if(a==='bg-save'){ const ta=document.getElementById('bgText'); const pr = S.profile || (S.profile = JSON.parse(JSON.stringify(profile()))); pr.background=(ta?ta.value:'').trim().slice(0,2000); save('profile'); bgDlg.edit=false; renderMoveDialog(); }
  else if(a==='hist-open'){ histDlg={confirm:false}; renderMoveDialog(); }
  else if(a==='hist-close'){ histDlg=null; renderMoveDialog(); render(); }
  else if(a==='hist-del'){ histDlg.confirm=true; renderMoveDialog(); }
  else if(a==='hist-del-no'){ histDlg.confirm=false; renderMoveDialog(); }
  else if(a==='hist-del-yes'){ S.chat={messages:[]}; showAll=false; save('chat'); histDlg.confirm=false; renderMoveDialog(); render(); }
  else if(a==='ins-open'){ insightDlg={edit:null}; renderMoveDialog(); }
  else if(a==='ins-close'){ insightDlg=null; renderMoveDialog(); render(); }
  else if(a==='ins-add'){ const i=document.getElementById('insNew'); const v=(i&&i.value||'').trim(); if(!v) return; setInsights([...insights(), v]); renderMoveDialog(); const n=document.getElementById('insNew'); if(n) n.focus(); }
  else if(a==='ins-del'){ const l=insights(); l.splice(Number(b.dataset.i),1); setInsights(l); renderMoveDialog(); }
  else if(a==='ins-edit'){ insightDlg.edit=Number(b.dataset.i); renderMoveDialog(); }
  else if(a==='ins-edit-no'){ insightDlg.edit=null; renderMoveDialog(); }
  else if(a==='ins-edit-yes'){ const ta=document.getElementById('insEdit'); const l=insights(); const i=Number(b.dataset.i); if(ta){ if(ta.value.trim()) l[i]=ta.value.trim(); else l.splice(i,1); } insightDlg.edit=null; setInsights(l); renderMoveDialog(); }
  else if(a==='ins-derive'){ insightDlg=null; renderMoveDialog(); askClaude('Bitte leite aus meinen bisherigen Aktivitäten, Rückmeldungen, Wochenfazits und dem Hintergrund die wichtigsten dauerhaften Erkenntnisse ab und liefere die vollständige Liste unter "insights". Behalte bestehende Erkenntnisse, sofern sie noch stimmen.'); }
  else if(a==='swap-open'){ swapDlg={date:b.dataset.date, title:b.dataset.title, text:''}; renderMoveDialog(); const ta=document.getElementById('swapText'); if(ta) ta.focus(); }
  else if(a==='swap-close'){ swapDlg=null; renderMoveDialog(); }
  else if(a==='swap-preset'){ if(swapDlg){ const p=b.dataset.p; swapDlg.text = (swapDlg.text||'').trim() ? swapDlg.text.trim()+', '+p : p; renderMoveDialog(); } }
  else if(a==='swap-do'){
    if(!swapDlg || !(swapDlg.text||'').trim()) return;
    const {date, title} = swapDlg, wish = swapDlg.text.trim();
    swapDlg=null; renderMoveDialog();
    if(S.plan){ S.plan.allowDates = [...new Set([...(S.plan.allowDates||[]), date])].filter(d=>d>=today()).sort(); await save('plan'); }
    if(sample && !busy) askClaude(`Bitte plane „${title}“ am ${fmtDay(date)} um. Stattdessen möchte ich: ${wish}. Ersetze die Einheit am selben Tag (Titel, Ziel der Einheit, konkrete Schritte) und gleiche die übrigen Einheiten der nächsten 14 Tage bei Bedarf an, damit Trainingslast und Wochenumfang stimmig bleiben. Weise kurz darauf hin, falls der Wunsch für das Ziel oder die Beschwerden ungünstig ist.`, {overlay:`„${title}“ umplanen`});
  }
  else if(a==='cancel-open'){ cancelDlg={date:b.dataset.date, title:b.dataset.title, preset:null, reason:''}; renderMoveDialog(); }
  else if(a==='cancel-close'){ cancelDlg=null; renderMoveDialog(); }
  else if(a==='cancel-preset'){ if(cancelDlg){ cancelDlg.preset = cancelDlg.preset===b.dataset.p ? null : b.dataset.p; renderMoveDialog(); } }
  else if(a==='cancel-do'){
    if(!cancelDlg || !S.plan) return;
    const {date, title} = cancelDlg; const reason = [cancelDlg.preset, (cancelDlg.reason||'').trim()].filter(Boolean).join(': ');
    cancelDlg=null; renderMoveDialog();
    const s = S.plan.sessions.find(x=>x.date===date && (x.title||'')===title && !x.cancelled); if(!s) return;
    s.cancelled = {reason, ts:new Date().toISOString()};
    S.plan.blockedDates = [...new Set([...(S.plan.blockedDates||[]), date])].filter(d=>d>=today()).sort();
    render(); await save('plan'); icuAutoSync();
    if(sample && !busy) askClaude(`Ich habe „${title}“ am ${fmtDay(date)} abgesagt. Grund: ${reason||'keine Angabe'}. Bitte berücksichtige den Grund bei der Umplanung bis Ende nächster Woche: Bei Krankheit oder Beschwerden die Trainingslast danach reduzieren und vorsichtig wieder einsteigen, bei Zeitmangel oder Wetter wichtige Inhalte sinnvoll auf andere Trainingstage verteilen, ohne Ruhetage zu opfern. Am ${fmtDay(date)} nichts planen. Frag nach, wenn der Grund für die Planung unklar ist.`, {auto:true, overlay:true, display:`„${title}“ abgesagt${reason?' – '+reason:''}`});
  }
  else if(a==='move-open'){ moveDlg={from:b.dataset.date, title:b.dataset.title, to:null}; renderMoveDialog(); }
  else if(a==='move-close'){ moveDlg=null; renderMoveDialog(); }
  else if(a==='move-pick'){ if(moveDlg){ moveDlg.to=b.dataset.to; renderMoveDialog(); } }
  else if(a==='move'){
    if(!moveDlg) return;
    const to = moveDlg.to, from = moveDlg.from, title = moveDlg.title;
    moveDlg=null; renderMoveDialog();
    if(!S.plan || !isDate(to) || to===from) return;
    const s = S.plan.sessions.find(x=>x.date===from && (x.title||'')===title); if(!s) return;
    s.date = to; s.extra = true;
    const uniq = arr => [...new Set(arr)].filter(d=>d>=today()).sort();
    S.plan.allowDates = uniq([...(S.plan.allowDates||[]), to]);
    S.plan.blockedDates = uniq([...(S.plan.blockedDates||[]).filter(d=>d!==to), from]);
    S.plan.sessions.sort((x,y)=>x.date.localeCompare(y.date));
    render(); await save('plan'); icuAutoSync();
    if(sample && !busy) askClaude(`Ich habe „${s.title}“ von ${fmtDay(from)} auf ${fmtDay(to)} verschoben, weil ich am ${fmtDay(from)} nicht kann. Die Einheit bleibt am ${fmtDay(to)}, am ${fmtDay(from)} bitte nichts planen. Prüfe Abstände und Trainingslast der angrenzenden Einheiten und passe den Plan an: Einheiten bei Bedarf kürzen oder tauschen und dafür andere verlängern, damit der Wochenumfang passt.`, {auto:true, overlay:true, display:`„${s.title}“ auf ${fmtDay(to)} verschoben`});
  }
  else if(a==='rm-complaint'){ confirmRm=Number(b.dataset.i); render(); }
  else if(a==='rm-no'){ confirmRm=null; render(); }
  else if(a==='info'){ infoOpen=!infoOpen; render(); }
  else if(a==='week-last'){ weekOffset=lastWeekOffset(); render(); }
  else if(a==='week-next'){ weekOffset=Math.max(0,weekOffset-1); render(); }
  else if(a==='week-summary'){
    const mon=b.dataset.mon, sun=addDays(mon,6);
    const dlg=((S.chat&&S.chat.messages)||[]).filter(m=>!m.error && m.ts && ymd(new Date(m.ts))>=mon && ymd(new Date(m.ts))<=sun)
      .map(m=>(m.role==='user'?userName()+': ':'Claude: ')+m.text.slice(0,400)).join('\n').slice(-6000);
    askClaude(`Bitte erstelle das Wochenfazit für die Woche ab ${fmtDay(mon)} (Schlüssel ${mon}): als Markdown-Liste mit fettem Stichwort je Zeile (Umfang, ${careMode()?'Beschwerden':'Befinden'}, Trainingslast, Auswertung, Besprochen, Ausblick), kein Fließtext. Liefere unter "assessments" für jede Einheit dieser Woche (IDs ${acts().filter(x=>x.date>=mon&&x.date<=sun&&x.sport!=='walk').map(x=>x.id).join(', ')}) eine Einschätzung mit "text" und "short" nach den aktuellen Regeln, auch wenn schon eine existiert${(()=>{const st=acts().filter(x=>x.date>=mon&&x.date<=sun&&staleAssess(x)).map(x=>x.id);return st.length?' und erneuere die durch neuere Rückmeldungen überholten Einschätzungen (IDs '+st.join(', ')+')':'';})()}. Stütze dich nur auf den aktuellen Stand der Rückmeldungen.${dlg?'\n\nDialog dieser Woche:\n'+dlg:''}`, {auto:true, display:`Wochenfazit für die Woche ab ${fmtDay(mon)} aktualisieren`});
  }
  else if(a==='macro-create') askClaude(macro()?'Bitte überarbeite den Gesamtplan auf Basis meiner bisherigen Entwicklung und liefere ihn vollständig unter "macro". Passe den Plan bis Ende nächster Woche nur an, wenn nötig.':'Bitte erstelle den Gesamtplan bis zum Ziel und liefere ihn vollständig unter "macro". Passe den Plan bis Ende nächster Woche nur an, wenn er nicht dazu passt.', {overlay:true, display: macro()?'Gesamtplan überarbeiten':'Gesamtplan erstellen'});
  else if(a==='replan') askClaude('Bitte plane bis Ende nächster Woche auf Basis meiner letzten Einheiten und Rückmeldungen neu.', {overlay:'Plan neu erstellen'});
  else if(a==='day' || a==='sport'){
    const pr = S.profile || (S.profile = JSON.parse(JSON.stringify(profile())));
    if(a==='day'){ const d=Number(b.dataset.day); const s=new Set(pr.trainingDays||[]); const l=new Set(longDaysOf(pr));
      let onlyLong = false;
      if(!s.has(d)) s.add(d); else if(!l.has(d)){ l.add(d); onlyLong = true; } else { l.delete(d); s.delete(d); }
      pr.trainingDays=[...s].sort(); pr.longRunDays=[...l].filter(x=>s.has(x)).sort();
      // nur die Markierung „lange Einheit“ geändert: Wochenplan anpassen, Gesamtplan bleibt
      markChange(onlyLong && !(pr.pendingChanges||{}).days ? 'longdays' : 'days', 'Trainingstage: '+([1,2,3,4,5,6,0].filter(x=>s.has(x)).map(x=>WD[x]+(l.has(x)?' (lange Einheit möglich)':'')).join(', ')||'keine')); if(pr.pendingChanges && pr.pendingChanges.days) delete pr.pendingChanges.longdays; }
    else { const k=b.dataset.sport; const s=new Set(sportsOf(pr)); const f=new Set(focusOf(pr));
      if(!s.has(k)) s.add(k); else if(!f.has(k)) f.add(k); else { f.delete(k); s.delete(k); }
      pr.sports=[...s]; pr.focus=[...f].filter(x=>s.has(x));
      markChange('sports', 'Sportarten: '+focusText(pr).replace(/\.$/,'')); }
    render(); save('profile');
  }
  else if(a==='cf-claude'){ const k=document.getElementById('cfKey'), m=document.getElementById('cfModel'); window.Android.setClaude(k?k.value:'', m?m.value:''); render(); }
  else if(a==='cf-strava'){ const i=document.getElementById('cfSid'), sc=document.getElementById('cfSecret'); window.Android.setStravaClient(i?i.value:'', sc?sc.value:''); window.Android.stravaConnect(); }
  else if(a==='upd-check'){ checkUpdate(true); }
  else if(a==='upd-install'){ installUpdate(); }
  else if(a==='upd-skip'){ try{ localStorage.setItem('ld-upd-skip', upd.info.version); }catch(_){} render(); }
  else if(a==='open-releases'){ try{ window.Android.openUrl(window.IS_WEB ? 'https://github.com/swissalpine/lauf-doch' : 'https://github.com/swissalpine/lauf-doch/releases'); }catch(_){} }
  else if(a==='cf-strava-off'){ window.Android.stravaDisconnect(); render(); }
  else if(a==='cf-strava-push'){ try{ const on = localStorage.getItem('ld-strava-push')==='1'; localStorage.setItem('ld-strava-push', on?'0':'1'); }catch(_){} render(); }
  else if(a==='cf-strava-re'){ window.Android.stravaConnect(); }
  else if(a==='done-push'){ const m = acts().find(x=>x.id===b.dataset.id); if(m) pushToStrava(m); }
  else if(a==='cf-icu-save'){
    const k=document.getElementById('cfIcu'); if(k && k.value.trim()) window.Android.setIntervals(k.value.trim());
    const pr = S.profile || (S.profile = JSON.parse(JSON.stringify(profile())));
    const m=document.getElementById('cfIcuMode'), rm=document.getElementById('cfIcuRide'), au=document.getElementById('cfIcuAuto');
    pr.icu = {mode: m?m.value:'hr', rideMode: rm?rm.value:'hr', auto: !!(au&&au.checked)};
    await save('profile'); window.Android.toast('Garmin-Einstellungen gespeichert.');
    render();
  }
  else if(a==='icu-sync'){ icuSync(true); }
  else if(a==='icu-one'){ const s0 = sessions().find(x=>x.date===b.dataset.date && (x.title||'')===b.dataset.title); const e = s0 && icuEntry(s0); if(e){ icuDlg = {ext:e.ext, title:s0.title||'Training', date:s0.date, sport:normSport(s0.sport), mode:icuModeFor(e)}; renderMoveDialog(); } }
  else if(a==='icu-pick'){ if(icuDlg){ icuDlg.mode = b.dataset.m; renderMoveDialog(); } }
  else if(a==='icu-close'){ icuDlg=null; renderMoveDialog(); }
  else if(a==='icu-send'){ const d=icuDlg; icuDlg=null; renderMoveDialog(); if(d) icuSync(true, d.ext, d.mode); }
  else if(a==='cf-export'){ const o=window.__ldExport(); if(expSecrets && window.Android.getSecrets){ try{ o.secrets=JSON.parse(window.Android.getSecrets()); }catch(e){} }
    if(!window.Android.saveBackup('lauf-doch-sicherung-'+today()+'.json', JSON.stringify(o))) window.Android.toast('Sicherung konnte nicht gespeichert werden.'); else { expSecrets=false; render(); } }
  else if(a==='cf-import'){ window.Android.pickBackup(); }
  else if(a==='reset-plan'||a==='reset-all'){ resetAsk = a==='reset-all'?'all':'plan'; render(); }
  else if(a==='reset-no'){ resetAsk = null; render(); }
  else if(a==='reset-yes'){ const k = resetAsk; resetAsk = null; await doReset(k); }
  else if(a==='cf-import-no'){ confirmImport=null; render(); }
  else if(a==='cf-import-yes'){ const o=confirmImport; const sec=o.secrets && (document.getElementById('cfImpSec')||{}).checked; confirmImport=null;
    if(sec && window.Android.setSecrets) window.Android.setSecrets(JSON.stringify(o.secrets));
    const d=Object.assign({},o); delete d.secrets; window.__ldImport(d);
    window.Android.toast(sec?'Sicherung und Zugangsdaten übernommen.':'Sicherung übernommen.'); weekInit=false; render(); }
  else if(a==='clear'){ confirmClear=true; render(); }
  else if(a==='clear-no'){ confirmClear=false; render(); }
  else if(a==='clear-yes'){ confirmClear=false; S.chat={messages:[]}; showAll=false; render(); save('chat'); }
});

/* ---------- Start ---------- */
render();
(async () => {
  const cl = window.claude;
  if(!cl || !cl.use){ mcpState='none'; sampleState='none'; S.loaded=true; render(); return; }
  cl.use('mcp').then(m => { mcp=m; mcpState=m?'ok':'none'; render(); setTimeout(autoSync, 800); });
  cl.use('sample').then(s => { sample=wrapSample(s); sampleState=s?'ok':'none'; render(); setTimeout(checkMissed, 500); setTimeout(autoExtend, 3000); setTimeout(maybeAssess, 6000); });
  const [user, dbx] = await Promise.all([cl.use('user'), cl.use('db')]);
  db = dbx; uid = user ? await user.id() : null;
  if(!db || !uid){ S.loaded=true; syncMsg={err:true, text:'Speichern ist in dieser Ansicht nicht möglich. Öffne die App angemeldet in claude.ai.'}; render(); return; }
  let pending = 4;
  ['profile','plan','log','chat'].forEach(name => {
    db.doc('data/users/'+uid+'/'+name).onSnapshot(snap => {
      S[name] = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
      if(name==='plan' && S.plan && Array.isArray(S.plan.sessions)){
        const t0 = today(), fut = S.plan.sessions.filter(x=>x.date>=t0), sp2 = splitStrength(fut);
        if(sp2){ S.plan.sessions = S.plan.sessions.filter(x=>x.date<t0).concat(sp2).sort((a,b)=>a.date.localeCompare(b.date)); setTimeout(()=>save('plan'), 0); }
      }
      if(pending>0){ pending--; if(pending===0){ S.loaded=true; setTimeout(()=>checkUpdate(false), 4000); setTimeout(checkMissed, 500); setTimeout(autoExtend, 3000); icuAutoSync(); setTimeout(autoSync, 800); } }
      if(!(busy && name==='chat')) render();
    }, () => { if(pending>0){ pending--; if(pending===0) S.loaded=true; } render(); });
  });
})();
})();
</script>
