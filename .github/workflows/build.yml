name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signaturschlüssel aus Secrets bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret KEYSTORE_BASE64 fehlt"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/laufdoch.keystore

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Signaturschlüssel wieder entfernen
        if: always()
        run: rm -f app/laufdoch.keystore

      - name: APK umbenennen und Version auslesen
        id: ver
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LaufDoch.apk
          echo "name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Lauf doch! ${{ steps.ver.outputs.name }}
          files: LaufDoch.apk
          make_latest: true

      - name: Alte Releases löschen (nur die letzten 3 behalten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r tag; do
              echo "Lösche $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
            done

      - name: Releases zu Tags außerhalb von main löschen (z. B. nach umgeschriebener Historie)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          for tag in $(git tag); do
            if ! git merge-base --is-ancestor "$tag" HEAD; then
              echo "Lösche $tag (nicht in main)"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || git push origin ":refs/tags/$tag" || true
            fi
          done
